<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка INSON</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Spline+Sans+Mono:wght@400;600&display=swap">
<!--
  Одна админка для браузера и для мини-аппа Telegram (21.09.2026).
  Это сборка уже готовых разделов, а не новая логика: страница либо читает существующие точки API,
  либо показывает готовую страницу во встроенном окне (iframe, тот же домен, сессия — cookie sid).
  Маршрут GET /admin/hub и режим ?embed=1 (без общего меню слева) делает app/main.py.
  Ничего сверх перечисленного здесь не появляется: спорные пункты уходят в docs/Открытые вопросы.md.
-->
<style>
/* ===== ui-kit кнопок INSON v1 — один и тот же блок в app/tg.html, app/admin_hub.html, app/login.html =====
   Цвет текста и фона у каждой кнопки задан явно и от темы Telegram не зависит (themeParams к кнопкам не применяются).
   Контраст белого текста: основная #1D2C8F — 11,6:1; успешная #177A41 — 5,4:1 (фирменный #22A85A даёт 3,1:1, не годится);
   опасная #A4231C — 7,4:1. Высота не меньше 44px. */
:root{--btn-line:#6B7883;--btn-hover:rgba(255,255,255,.06);--focus:#8EA9FF;--link:#8EA9FF}
html[data-theme="light"]{--btn-line:#7A8894;--btn-hover:rgba(16,28,38,.06);--focus:#1D2C8F;--link:#1D2C8F}
.btn{-webkit-appearance:none;appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  box-sizing:border-box;min-height:44px;width:auto;max-width:100%;margin:0;padding:10px 18px;border:1px solid transparent;border-radius:10px;
  font:700 14px/1.25 var(--sans,system-ui,sans-serif);text-align:center;text-decoration:none;white-space:normal;
  cursor:pointer;transition:background-color .12s,border-color .12s}
.btn svg{flex:none;width:18px;height:18px}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn-primary,.btn-primary:visited{background:#1D2C8F;border-color:#4A5BC4;color:#FFFFFF;-webkit-text-fill-color:#FFFFFF}
.btn-primary:hover:not(:disabled){background:#16236F;border-color:#6B7BD6;color:#FFFFFF}
.btn-primary:active:not(:disabled){background:#111B57}
.btn-success,.btn-success:visited{background:#177A41;border-color:#177A41;color:#FFFFFF;-webkit-text-fill-color:#FFFFFF}
.btn-success:hover:not(:disabled){background:#12653A;border-color:#12653A;color:#FFFFFF}
.btn-success:active:not(:disabled){background:#0E5230}
.btn-danger,.btn-danger:visited{background:#A4231C;border-color:#A4231C;color:#FFFFFF;-webkit-text-fill-color:#FFFFFF}
.btn-danger:hover:not(:disabled){background:#8F1D17;border-color:#8F1D17;color:#FFFFFF}
.btn-danger:active:not(:disabled){background:#761712}
.btn-secondary,.btn-secondary:visited{background:transparent;border-color:var(--btn-line);color:var(--ink);-webkit-text-fill-color:var(--ink)}
.btn-secondary:hover:not(:disabled){background:var(--btn-hover);color:var(--ink)}
.btn-secondary:active:not(:disabled){background:var(--btn-hover);border-color:var(--ink)}
.btn-link,.btn-link:visited{background:transparent;border-color:transparent;padding:10px 4px;font-weight:600;
  color:var(--link);-webkit-text-fill-color:var(--link);text-decoration:underline;text-underline-offset:3px}
.btn-link:hover:not(:disabled){text-decoration-thickness:2px;color:var(--link)}
.btn-block{display:flex;width:100%}
.btn-sm{min-height:44px;padding:8px 12px;font-size:13px}
/* ряд действий: внизу карточки справа; на телефоне — на всю ширину, основная кнопка первой (она первая в разметке) */
.actions{display:flex;flex-direction:row-reverse;flex-wrap:wrap;justify-content:flex-start;align-items:center;gap:8px;margin-top:16px}
@media (max-width:599px){.actions{flex-direction:column;align-items:stretch}.actions .btn{width:100%}}
/* ===== конец ui-kit ===== */
:root{--paper:#0F1418;--card:#161C21;--ink:#E6ECF0;--muted:#8E9BA6;--line:#26303A;--soft:#1C242B;
  --accent:#2BC46E;--accent-dim:#1E8F52;--warn:#E0A83F;--stop:#EE8272;--ok:#5CC298;
  --sans:"Manrope",system-ui,sans-serif;--mono:"Spline Sans Mono",ui-monospace,monospace;
  --rail:58px;--menu:214px}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans)}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:var(--rail) var(--menu) minmax(0,1fr);align-items:start}

/* --- рейка групп --- */
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:#0C1216;border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:2px;padding:10px 0}
.rail .mark{display:grid;place-items:center;height:40px;margin-bottom:8px}
.rail .mark b{width:30px;height:30px;border-radius:50%;background:var(--accent-dim);display:grid;place-items:center;
  color:#0C1216;font:800 13px var(--sans)}
.rail button{background:none;border:0;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:3px;padding:8px 2px;font:600 9px var(--sans);line-height:1.15;text-align:center;width:100%}
.rail button i{font-style:normal;font-size:17px;line-height:1}
.rail button u{text-decoration:none}
.rail button.on{color:var(--accent);box-shadow:inset 2px 0 0 var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.rail button:focus-visible,.menu a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* --- список разделов группы --- */
.menu{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);padding:16px 10px 24px;background:var(--card)}
.menu h2{font:800 13px var(--sans);margin:0 0 2px;padding:0 8px}
.menu p{font-size:11px;color:var(--muted);margin:0 0 12px;padding:0 8px}
.menu a{display:block;text-decoration:none;color:var(--muted);font-weight:600;font-size:13px;
  padding:8px 10px;border-radius:9px}
.menu a.on{color:var(--ink);background:var(--soft);box-shadow:inset 2px 0 0 var(--accent)}

/* --- содержимое --- */
main{padding:20px 22px 44px;min-width:0}
.head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
h1{font:800 21px var(--sans);margin:0}
.head .why{font-size:12.5px;color:var(--muted);max-width:56ch;margin:2px 0 0}
.back{display:none;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:12px;min-width:0}
.card h3{font:700 14px var(--sans);margin:0 0 3px}
.card .note{font-size:12px;color:var(--muted);margin:0 0 10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font:600 21px var(--mono)}.tile span{font-size:11.5px;color:var(--muted)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 10.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
tr.pick{cursor:pointer}tr.pick:hover td{background:var(--soft)}
.v{display:inline-block;font:700 11px var(--sans);border-radius:5px;padding:1px 7px;white-space:nowrap}
.v.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.v.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.v.stop{background:color-mix(in srgb,var(--stop) 16%,transparent);color:var(--stop)}
.v.dim{background:var(--soft);color:var(--muted)}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.msg{font-size:12px;color:var(--muted);margin-top:8px;min-height:1em}
.msg.bad{color:var(--stop)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:5px 14px;font-size:13px}
.kv span{color:var(--muted)}
.frame{width:100%;height:calc(100vh - 150px);min-height:460px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.hint{font-size:12px;color:var(--muted);margin:0 0 8px}
.flag{border-left:3px solid var(--warn);padding-left:9px;color:var(--warn);font-size:12px;margin:0 0 10px}
@media (max-width:860px){
  :root{--rail:48px}
  .app{grid-template-columns:var(--rail) minmax(0,1fr)}
  .menu{display:none}
  body.menu-view .menu{display:block;position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  body.menu-view main{display:none}
  main{padding:14px 12px 40px}
  body.section-view .back{display:inline-flex}
  .frame{height:calc(100vh - 170px)}
  h1{font-size:18px}
}
</style>

</div>

/* ------------------------------------------------------------------ обмен */
async function api(path, options) {
  var r = await fetch(path, Object.assign({headers: {Accept: "application/json"}}, options || {}));
  var body = null;
  try { body = await r.json(); } catch (e) { body = null; }
  if (!r.ok) {
    var d = body && body.detail ? (typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail)) : "";
    if (r.status === 401) d = d || "Нужно войти в систему";
    if (r.status === 403) d = d || "Раздел открыт только администратору";
    throw new Error(d || ("сервер ответил " + r.status));
  }
  return body;
}
async function send(path, method, data) {
  return api(path, {method: method, headers: {"Content-Type": "application/json", Accept: "application/json"},
                    body: JSON.stringify(data || {})});
}
function fail(e) {
  return '<div class="card"><h3>Раздел не загрузился</h3><p class="note">Причина: ' + esc(e.message || e) +
         '.</p><p class="note">Что сделать: обновите страницу; если сказано про вход — войдите заново ' +
         'на <a href="/login">странице входа</a>; если раздел открыт только администратору — попросите админа.</p></div>';
}
function tbl(head, rows, empty) {
  return '<div class="scroll"><table><thead><tr>' + head.map(function (h) { return "<th>" + h + "</th>"; }).join("") +
    "</tr></thead><tbody>" + (rows.length ? rows.join("") :
    '<tr><td colspan="' + head.length + '">' + (empty || "Записей пока нет") + "</td></tr>") + "</tbody></table></div>";
}
function frame(src, title) {
  var sep = src.indexOf("?") >= 0 ? "&" : "?";
  return '<p class="hint">Раздел открыт как есть — той же страницей, что и отдельным адресом ' +
         '<a href="' + esc(src) + '" target="_blank" rel="noopener">' + esc(src) + '</a>.</p>' +
         '<iframe class="frame" src="' + esc(src + sep + "embed=1") + '" title="' + esc(title) + '" loading="lazy"></iframe>';
}

var V = {};

/* Способ входа из ответа /tg/users. Старый сервер поля не отдаёт — прочерк. */
var LOGIN_METHOD = {telegram: ["telegram", "Telegram"], google: ["google", "Google"],
  both: ["both", "Telegram и Google"], service: ["service", "Служебный"]};
function login_method(m) {
  var x = LOGIN_METHOD[m];
  if (!x) return "—";
  return window.T ? window.T("tg.login_method." + x[0], x[1]) : x[1];
}

/* --- Люди --- */

  var d = await api("/tg/users");
  var rows = d.items.map(function (u) {
    var way = login_method(u.login_method);
    var mail = u.email || "—";

    var st = u.status === "активен" ? "ok" : u.status === "заблокирован" ? "stop" : "warn";
    var ctl = d.can_manage
      ? (u.is_admin ? '<button class="btn btn-secondary btn-sm" data-act="revoke" data-id="' + u.id + '">Снять права админа</button>'
                    : '<button class="btn btn-secondary btn-sm" data-act="make" data-id="' + u.id + '">Сделать админом</button>') +

      : "—";
    return "<tr><td>" + esc(u.full_name || u.login) + "</td><td>" + esc(u.department) + "</td><td>" + esc(u.position) +

      "</td><td>" + role + '</td><td><span class="v ' + st + '">' + esc(u.status) + "</span></td><td>" + ctl + "</td></tr>";
  });

/* Страховые резервы по периодам (app/finance.py): вручную или файлом Excel, предпросмотр, замена с историей. */
var FIN = {st: null, preview: null};
function fin_parse(s) {                      /* «1 250 000,50» → 1250000.5; пусто → null; не число → NaN */
  s = String(s == null ? "" : s).replace(/[\s  ]/g, "").replace(",", ".");
  return s === "" ? null : (/^\d+(\.\d+)?$/.test(s) ? Number(s) : NaN);
}
function fin_fmt(input) {                    /* разделители тысяч прямо в поле */
  var v = input.value.replace(/[^\d,.]/g, "").replace(".", ","), p = v.split(",");
  var int = p[0].replace(/^0+(?=\d)/, "").replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  input.value = p.length > 1 ? int + "," + p.slice(1).join("").slice(0, 2) : int;
}
function fin_money(n) { return n == null ? "—" : Number(n).toLocaleString("ru-RU", {maximumFractionDigits: 2}); }
async function fin_call(path, method, data) {  /* как send, но отдаёт и код ответа: 409 — «заменить?» */
  var r = await fetch(path, {method: method, headers: {"Content-Type": "application/json", Accept: "application/json"},
                             body: data ? JSON.stringify(data) : undefined});
  var b = null; try { b = await r.json(); } catch (e) { b = null; }
  return {status: r.status, body: b};
}
function fin_err(b, status) {
  var d = b && b.detail;
  if (d && typeof d === "object") return esc(d.message || "") + (d.errors ? "<ul>" + d.errors.map(function (x) {
    return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : "");
  return esc(d || ("сервер ответил " + status));
}
function fin_period() {
  var y = Number($("#finYear").value), t = $("#finType").value;
  if (!Number.isInteger(y) || y < FIN.st.year_min || y > FIN.st.year_max)
    throw new Error("Год — целое число от " + FIN.st.year_min + " до " + FIN.st.year_max);
  return {period_year: y, period_type: t};
}
async function fin_save(payload, msg) {
  msg.className = "msg"; msg.textContent = "Сохраняем…";
  var r = await fin_call("/finance/reserves", "POST", payload);
  if (r.status === 409 && r.body && r.body.detail && r.body.detail.existing) {
    var ex = r.body.detail.existing;
    var ok = window.confirm(r.body.detail.message + "\n\nСейчас сохранено: итог " + fin_money(ex.total) + " сум, внёс " +
      (ex.created_by || "—") + " " + String(ex.created_at || "").replace("T", " ").slice(0, 16) +
      ".\nСтарая версия останется в истории.");
    if (!ok) { msg.textContent = "Не сохранено: оставили прежний отчёт."; return false; }
    payload.replace = true;
    r = await fin_call("/finance/reserves", "POST", payload);
  }
  if (r.status !== 200) { msg.className = "msg bad"; msg.innerHTML = "Не сохранилось: " + fin_err(r.body, r.status); return false; }
  msg.textContent = "Сохранено. Итог резервов: " + fin_money(r.body.total) + " сум" + (r.body.replaced ? " (прежняя версия — в истории)." : ".");
  fin_list();
  return true;
}

async function fin_list() {
  var box = $("#finList"); if (!box) return;
  try {
    var d = await api("/finance/reserves" + ($("#finHist").checked ? "?history=1" : ""));
    box.innerHTML = tbl(["Год", "Период", "Отчётная дата", "Итог, сум", "Источник", "Кто внёс", "Когда", "Состояние", ""],
      d.items.map(function (p) {
        var st = p.status === "действует" ? (p.id === d.latest_id ? '<span class="v ok">в расчёте ёмкости</span>' : '<span class="v dim">действует</span>')
          : '<span class="v warn">' + esc(p.status) + "</span>";
        return "<tr><td>" + esc(p.period_year) + "</td><td>" + esc(p.period_label) + "</td><td>" + esc(p.report_date) +
          '</td><td class="n">' + fin_money(p.total) + "</td><td>" + esc(p.source) + (p.file_name ? '<br><span class="hint">' + esc(p.file_name) + "</span>" : "") +
          "</td><td>" + esc(p.created_by || "—") + "</td><td>" + when(p.created_at) + "</td><td>" + st + "</td><td>" +
          '<button class="btn btn-secondary btn-sm" type="button" data-fin-open="' + p.id + '">Открыть</button> ' +
          (p.status === "действует" ? '<button class="btn btn-danger btn-sm" type="button" data-fin-del="' + p.id + '">Удалить</button>' : "") +
          "</td></tr>"; }), "Отчётов о резервах пока нет");
    box.onclick = async function (e) {
      var o = e.target.closest("[data-fin-open]"), x = e.target.closest("[data-fin-del]");
      if (o) return fin_view(o.dataset.finOpen);
      if (!x) return;
      var row = d.items.filter(function (p) { return String(p.id) === x.dataset.finDel; })[0];
      if (!window.confirm("Удалить отчёт о резервах за " + row.period_label.toLowerCase() + " " + row.period_year +
          " (итог " + fin_money(row.total) + " сум)?\nЗапись останется в истории и в журнале действий.")) return;
      var r = await fin_call("/finance/reserves/" + row.id, "DELETE");
      if (r.status !== 200) { window.alert("Не удалось удалить: " + (r.body && r.body.detail || r.status)); return; }
      $("#finView").innerHTML = ""; fin_list();
    };
  } catch (e) { box.innerHTML = fail(e); }
}
async function fin_view(id) {
  var v = $("#finView"); v.innerHTML = '<p class="hint">Загружаем…</p>';
  try {
    var p = await api("/finance/reserves/" + id);
    v.innerHTML = '<h3 style="margin-top:14px">' + esc(p.period_label) + " " + esc(p.period_year) + " — на " + esc(p.report_date) +
      ' <span class="v ' + (p.status === "действует" ? "ok" : "warn") + '">' + esc(p.status) + "</span></h3>" +
      tbl(["Вид резерва", "Группа / вид", "Сумма, сум"], p.lines.map(function (x) {
        return "<tr><td>" + esc(x.label) + "</td><td>" + esc(x.group_label) + '</td><td class="n">' + fin_money(x.amount) + "</td></tr>"; })) +
      '<div class="kv" style="margin-top:10px"><span>Итого резервов</span><div>' + fin_money(p.total) + " сум</div>" +
      "<span>Базовая премия за 12 мес.</span><div>" + fin_money(p.base_premium_12m) + "</div>" +
      "<span>Источник</span><div>" + esc(p.source) + (p.file_name ? " — " + esc(p.file_name) : "") + "</div>" +
      "<span>Внёс</span><div>" + esc(p.created_by || "—") + ", " + when(p.created_at) + "</div>" +
      (p.closed_at ? "<span>" + (p.status === "заменён" ? "Заменил" : "Удалил") + "</span><div>" + esc(p.closed_by || "—") + ", " + when(p.closed_at) + "</div>" : "") +
      "</div>" + (p.history.length > 1 ? '<p class="note" style="margin-top:10px">Версии этого периода:</p>' +
      tbl(["Версия", "Итог, сум", "Источник", "Внёс", "Состояние"], p.history.map(function (h) {
        return '<tr class="pick" data-fin-open="' + h.id + '"><td>№ ' + h.id + '</td><td class="n">' + fin_money(h.total) + "</td><td>" + esc(h.source) +
          "</td><td>" + esc(h.created_by || "—") + ", " + when(h.created_at) + "</td><td>" + esc(h.status) + "</td></tr>"; })) : "");
    v.onclick = function (e) { var o = e.target.closest("[data-fin-open]"); if (o) fin_view(o.dataset.finOpen); };
  } catch (e) { v.innerHTML = fail(e); }
}

/* --------------------------------------------------------------- формы */
function bind_forms(el) {
  el.querySelectorAll("form.f[data-url]").forEach(function (f) {
    f.onsubmit = async function (e) {
      e.preventDefault();
      var d = {}, msg = f.nextElementSibling;
      new FormData(f).forEach(function (v, k) {
        if (v === "") return;
        d[k] = (isNaN(v) || k.slice(-4) === "code" || k === "name" || k === "classes") ? v : Number(v);
      });
      if (d.classes) d.classes = String(d.classes).split(",").map(function (s) { return s.trim(); });
      msg.className = "msg"; msg.textContent = "Сохраняем…";
      try {
        var j = await send(f.dataset.url, f.dataset.m, d);
        msg.textContent = "Сохранено." + (j && j.id ? " ID: " + j.id : "");
        f.reset();
      } catch (err) { msg.className = "msg bad"; msg.textContent = "Не сохранилось: " + err.message; }
    };
  });
}

/* --------------------------------------------------------------- навигация */
var narrow = function () { return window.matchMedia("(max-width:860px)").matches; };
/* Свои классы ставим точечно: на странице может быть ещё и общее меню сервера,
   которое держит на body свои классы (side-open, side-wide) — их стирать нельзя. */
function view_mode(mode) {
  document.body.classList.toggle("menu-view", mode === "menu");
  document.body.classList.toggle("section-view", mode === "section");
}
var cur = {g: "people", s: "users"};

function paint_rail() {
  var r = $("#rail");
  r.innerHTML = '<div class="mark"><b>S</b></div>' + NAV.map(function (g) {
    return '<button type="button" data-g="' + g.id + '"' + (g.id === cur.g ? ' class="on"' : "") +
      ' title="' + esc(g.title) + '"><i aria-hidden="true">' + g.icon + "</i><u>" + esc(g.short) + "</u></button>";
  }).join("");
  r.onclick = function (e) {
    var b = e.target.closest("button[data-g]"); if (!b) return;
    var g = NAV.filter(function (x) { return x.id === b.dataset.g; })[0];
    if (narrow()) { cur.g = g.id; paint_rail(); paint_menu(); view_mode("menu"); }
    else open_section(g.id, g.items[0].id);
  };
}
function paint_menu() {
  var g = NAV.filter(function (x) { return x.id === cur.g; })[0];
  $("#menu").innerHTML = "<h2>" + esc(g.title) + "</h2><p>" + esc(g.why) + "</p>" + g.items.map(function (it) {
    return '<a href="#' + g.id + "/" + it.id + '"' + (it.id === cur.s ? ' class="on"' : "") + ">" + esc(it.title) + "</a>";
  }).join("");
}
async function open_section(gid, sid, arg) {
  var g = NAV.filter(function (x) { return x.id === gid; })[0] || NAV[0];
  var s = g.items.filter(function (x) { return x.id === sid; })[0] || g.items[0];
  cur = {g: g.id, s: s.id};
  if (location.hash !== "#" + g.id + "/" + s.id) location.hash = g.id + "/" + s.id;
  view_mode(narrow() ? "section" : "");
  paint_rail(); paint_menu();
  $("#title").textContent = s.title;
  $("#why").textContent = s.why || "";
  var view = $("#view");
  view.onclick = null;
  view.innerHTML = '<p class="hint">Загружаем раздел…</p>';
  var fn = V[g.id + "_" + s.id];
  if (!fn) { view.innerHTML = '<p class="hint">Раздел пока пуст.</p>'; return; }
  try { await fn(view, arg); } catch (e) { view.innerHTML = fail(e); }
  if (window.i18nPaint) window.i18nPaint(view);
}
$("#back").onclick = function () { view_mode("menu"); };
window.addEventListener("hashchange", function () {
  var p = location.hash.replace("#", "").split("/");
  if (p[0] && (p[0] !== cur.g || p[1] !== cur.s)) open_section(p[0], p[1]);
});
window.addEventListener("resize", function () {
  if (!narrow()) view_mode("");
  else if (!document.body.classList.contains("menu-view")) view_mode("section");
});
(function () {
  var p = location.hash.replace("#", "").split("/");
  open_section(p[0] || "people", p[1] || "users");
})();
</script>
