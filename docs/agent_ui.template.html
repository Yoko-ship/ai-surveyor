<title>Сюрвейер INSON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F2F5F7; --card:#FFFFFF; --ink:#101C26; --muted:#5C6C78; --line:#DDE4E9; --soft:#EDF1F4;
  --accent:#12557E; --accent-soft:#E3EEF6; --ok:#17734F; --warn:#9A6209; --stop:#B23A2F;
  --on-accent:#FFFFFF; --on-accent-soft:rgba(255,255,255,.22);
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Spline Sans Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1519; --card:#151E24; --ink:#E6ECF0; --muted:#94A5B0; --line:#26323A; --soft:#1B252C;
    --accent:#6FB6E4; --accent-soft:#17303F; --ok:#5CC298; --warn:#E0A83F; --stop:#EE8272;
    --on-accent:#0B1418; --on-accent-soft:rgba(11,20,24,.16);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1519; --card:#151E24; --ink:#E6ECF0; --muted:#94A5B0; --line:#26323A; --soft:#1B252C;
  --accent:#6FB6E4; --accent-soft:#17303F; --ok:#5CC298; --warn:#E0A83F; --stop:#EE8272;  --on-accent:#0B1418; --on-accent-soft:rgba(11,20,24,.16);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:22px 40px}
header{margin-bottom:16px}
h1{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:0}
header p{margin:4px 0 0;color:var(--muted);font-size:13.5px;max-width:62ch}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}   /* 0 — чтобы карточки не растягивали страницу вбок на телефоне */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.card + .card{margin-top:14px}
.card h2{font-size:17px;font-weight:700;margin:0 0 3px}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px}
label.f,.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
label.f > span{font-weight:600}
label.f em{font-style:normal;font-size:12px;color:var(--muted);font-weight:400}
input,select{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px 12px;width:100%;font-size:15px}
input[type="number"]{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:12px;color:var(--muted)}

/* выбор продукта */
.prod{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;
      border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--soft)}
.prod .nm{font-size:17px;font-weight:700;line-height:1.3}
.prod .code{font-family:var(--mono);color:var(--muted);font-size:13px}
.prod .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.prod button{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.tag{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted);background:var(--card)}
.tag.rate{color:var(--ink);font-family:var(--mono)}
.tag.mode{color:var(--warn);border-color:var(--warn)}
.picker{margin-top:14px}
.plist{max-height:330px;overflow:auto;border:1px solid var(--line);border-radius:11px;margin-top:10px}
.plist h4{position:sticky;top:0;margin:0;padding:8px 12px;font-size:12px;font-weight:700;letter-spacing:.04em;
          text-transform:uppercase;color:var(--muted);background:var(--soft);border-bottom:1px solid var(--line)}
.plist button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:transparent;border:0;
              border-bottom:1px solid var(--line);padding:10px 12px;cursor:pointer;font-size:14px}
.plist button:hover{background:var(--accent-soft)}
.plist button.on{background:var(--accent-soft);font-weight:700}
.plist button i{font-family:var(--mono);font-style:normal;color:var(--muted);font-size:12.5px;flex:none;width:44px}
.plist button span{flex:1}
.plist button u{text-decoration:none;font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.empty{padding:16px 12px;color:var(--muted);font-size:13.5px}

.perils{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:8px}
.peril{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;background:var(--card)}
.peril:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.peril input{width:auto;margin:0;accent-color:var(--accent)}
.peril .nm{flex:1;font-size:13.5px;font-weight:500}
.peril .pc{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cat{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:0 4px}

details.card > summary{cursor:pointer;font-size:17px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
details.card > summary::-webkit-details-marker{display:none}
details.card > summary .cnt{font-size:13px;font-weight:600;color:var(--muted)}
details.card[open] > summary{margin-bottom:14px}
.docs{display:flex;flex-direction:column;gap:2px}
.doc{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px}
.doc:last-child{border-bottom:0}
.doc input{width:auto;accent-color:var(--accent)}
.doc .lbl{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.doc .lbl.req{color:var(--stop)}

/* Панель расчёта */
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sum-top{padding:20px;border-bottom:1px solid var(--line)}
.premium{font-family:var(--mono);font-size:33px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.premium small{font-size:15px;color:var(--muted);font-weight:400}
.rateline{display:flex;align-items:baseline;gap:8px;margin-top:6px;font-size:13.5px;color:var(--muted)}
.rateline b{font-family:var(--mono);color:var(--ink);font-size:16px}
.scale{margin-top:14px}
.scale .bar{position:relative;height:8px;border-radius:5px;background:var(--soft);overflow:hidden}
.scale .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.scale .marks{display:flex;justify-content:space-between;margin-top:5px;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.sec{padding:16px 20px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.wf{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.wf div{display:flex;justify-content:space-between;gap:10px}
.wf .v{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.wf .up{color:var(--stop)} .wf .down{color:var(--ok)}
.wf .total{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.chk.stop .dot{background:var(--stop)} .chk.warn .dot{background:var(--warn)} .chk.ok .dot{background:var(--ok)}
.chk .t{font-weight:600} .chk .d{color:var(--muted);font-size:12.5px}
.tip{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.tip:last-child{border-bottom:0}
.tip button{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.tip .save{font-family:var(--mono);color:var(--ok);font-weight:600}
.measure{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;padding:9px 0;border-bottom:1px solid var(--line)}
.measure:last-child{border-bottom:0}
.measure b{font-weight:600}
.measure small{grid-column:1/-1;color:var(--muted)}
.measure .lbl{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;align-self:start;border-radius:4px;padding:1px 6px;border:1px solid var(--line);color:var(--muted)}
.measure .lbl.must{color:var(--stop);border-color:var(--stop)}
.verdict{display:flex;align-items:center;gap:9px;padding:13px 20px;font-weight:700;font-size:14px}
.verdict.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
.verdict.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.verdict.stop{background:color-mix(in srgb,var(--stop) 13%,transparent);color:var(--stop)}
.actions{display:flex;gap:9px;padding:14px 20px}
.actions button{flex:1;border-radius:10px;padding:10px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--card)}
.actions .primary{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .actions .primary{color:#0E1519}}
:root[data-theme="dark"] .actions .primary{color:#0E1519}
/* фото и ручной ввод */
.photozone{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.upload{display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--line);border-radius:10px;padding:9px 13px;cursor:pointer;font-size:14px;font-weight:600;background:var(--soft)}
.upload input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#photoRun{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:9px 15px;font-weight:600;cursor:pointer}
#photoRun:disabled{opacity:.45;cursor:not-allowed}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #photoRun{color:#0E1519}}
:root[data-theme="dark"] #photoRun{color:#0E1519}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.thumbs figure{margin:0;width:118px}
.thumbs img{width:118px;height:84px;object-fit:cover;border-radius:9px;border:1px solid var(--line);display:block}
.thumbs figcaption{font-size:11px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumbs figure{position:relative}
.thumbs .del{position:absolute;top:4px;right:4px;border:1px solid var(--line);background:var(--card);color:var(--ink);
             border-radius:7px;padding:1px 7px;font-size:12px;line-height:1.5;cursor:pointer;opacity:.9}
.thumbs .del:hover{border-color:var(--stop);color:var(--stop)}
.note{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:9px;background:var(--soft);
      padding:10px 12px;font-size:13px;color:var(--muted);margin-top:12px}
.note b{color:var(--ink)}
.note.bad{border-left-color:var(--stop)}
.note.good{border-left-color:var(--ok)}
.act{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
.act:disabled{opacity:.45;cursor:not-allowed}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .act{color:#0E1519}}
:root[data-theme="dark"] .act{color:#0E1519}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.srcs{margin:0;padding:0;list-style:none;font-size:13.5px}
.srcs li{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.srcs li:last-child{border-bottom:0}
.srcs .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--muted)}
.srcs li.ok .dot{background:var(--ok)} .srcs li.bad .dot{background:var(--stop)}
.srcs .nm{font-weight:600}
.srcs .why{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.ads{margin:0;padding:0;list-style:none;font-size:13.5px}
.ads li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.ads li:last-child{border-bottom:0}
.ads a{color:var(--accent)}
.ads .p{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.steps{font-family:var(--mono);font-size:12.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;
       background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;color:var(--ink)}
.letter{white-space:pre-wrap;font-size:13px;line-height:1.55;background:var(--soft);border:1px solid var(--line);
        border-radius:10px;padding:12px;margin:10px 0 0;max-height:260px;overflow:auto}
/* плашка источника: чей текст перед нами и куда идти за оригиналом */
.srcbar{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px;
        background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.srcbar p{margin:0;font-size:12px;line-height:1.5;color:var(--muted);max-width:66ch;flex:1 1 300px}
.srcbar p b{color:var(--ink);font-weight:600}
.srcbar .go{display:flex;gap:8px;flex-wrap:wrap;flex:0 0 auto}
.srcbar .go a{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--on-accent);
        border-radius:999px;padding:8px 10px 8px 14px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.srcbar .go a:hover{filter:brightness(1.08)}
.srcbar .go .dom{background:var(--on-accent-soft);border-radius:999px;padding:2px 9px;
        font-family:var(--mono);font-size:12px;font-weight:500}
@media (max-width:620px){
  .srcbar{flex-direction:column;align-items:stretch}
  .srcbar .go{flex-direction:column}
  .srcbar .go a{justify-content:space-between}
}
.big{font-family:var(--mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.src{display:none;margin-left:7px;font-size:11px;font-weight:600;color:var(--accent);opacity:.85;vertical-align:middle}
.src::before{content:"· "}
.src.on{display:inline-block}
.docpanel{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:12px 13px}
.docpanel h3{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:12px 0 8px}
.docpanel h3:first-child{margin-top:0}
.docpanel .kvs{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:0}
.docpanel .kvs dt{color:var(--muted)}
.docpanel .kvs dd{margin:0;overflow-wrap:anywhere}
.applied{margin-top:14px;border-top:1px solid var(--line)}
.applied .tip .save{color:var(--accent)}
.switch{display:inline-flex;align-items:center;gap:9px;font-weight:600;cursor:pointer}
.switch input{width:auto;accent-color:var(--accent)}
.foot{margin-top:16px;font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);border-radius:5px;padding:2px 7px}
/* переключатель группы объекта и подсказки справочника */
.seg{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:999px;
     padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.seg.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.segs{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.hits{border:1px solid var(--line);border-radius:11px;margin-top:9px;max-height:240px;overflow:auto}
.hits button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:transparent;border:0;
             border-bottom:1px solid var(--line);padding:9px 12px;cursor:pointer;font-size:14px}
.hits button:hover{background:var(--accent-soft)}
.hits button i{font-family:var(--mono);font-style:normal;color:var(--muted);font-size:12.5px;flex:none;width:52px}
.hits button span{flex:1}
.hits button u{text-decoration:none;font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
@media (max-width:560px){
  .wrap{padding-inline:14px}
  .card{padding:16px}
  .row{grid-template-columns:1fr}
  .premium{font-size:28px}
}
</style>

<div class="wrap">
  <header>
    <h1 data-i18n="calc.title">Новый расчёт</h1>
    <p data-i18n="calc.subtitle">Выберите продукт и заполните поля. Ставка и премия справа пересчитываются сразу — кнопку «посчитать» нажимать не нужно.</p>
  </header>

  <div class="grid">
    <main id="panes"></main>

    <aside class="summary" aria-live="polite">
      <div class="sum-top">
        <div class="premium" id="premium">—</div>
        <div class="rateline"><span data-i18n="calc.rate_word">ставка</span> <b id="rate">—</b> <span id="rateNote"></span></div>
        <div class="scale">
          <div class="bar"><div class="fill" id="fill" style="width:0"></div></div>
          <div class="marks"><span id="mMin">мин —</span><span id="mTech">тех —</span><span id="mMax">макс —</span></div>
        </div>
        <div id="market" class="hint" style="margin-top:8px"></div>
      </div>
      <div class="verdict" id="verdict"></div>
      <div class="sec"><h3 data-i18n="calc.breakdown">Из чего сложилась ставка</h3><div class="wf" id="wf"></div></div>
      <div class="sec"><h3 data-i18n="calc.checks">Проверки</h3><div id="checks"></div></div>
      <div class="sec"><h3 data-i18n="calc.cheaper">Как удешевить</h3><div id="tips"></div></div>
      <div class="sec" id="msec" hidden><h3 data-i18n="calc.measures">Что предписать страхователю</h3><div id="measures"></div></div>
      <div class="actions">
        <button type="button" id="toUnderwriter" data-i18n="calc.for_underwriter">Андеррайтеру</button>
        <button type="button" class="primary" id="toContract" data-i18n="calc.for_contract">В договор</button>
      </div>
    </aside>
  </div>
  <p class="foot" id="foot"></p>
</div>

<script src="/i18n.js"></script>
<script>
/* Подписи экрана: T("ключ", "русский запас") из /i18n.js. Нет словаря — остаётся русский. */
if (!window.T) window.T = (k, f, v) => { let s = (f != null ? f : k);
  if (v) for (const n in v) s = String(s).split("{" + n + "}").join(v[n]); return s; };
const D = __DATA__;
const fmt = n => Math.round(n).toLocaleString("ru-RU");
const pc = n => Number(n).toFixed(3).replace(".", ",") + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const CLASS = Object.fromEntries(D.classes.map(c => [c.code, c]));
const PROD = Object.fromEntries(D.products.map(p => [p.code, p]));
const LOAD = D.load.reduce((s, l) => s + l.share, 0);   // РВД + комиссия + прибыль
const RISK_LOAD = 0.12;                                  // рисковая надбавка, как в движке
const CAT_PERILS = ["earthquake", "mudflow", "landslide"];
const CREDIT_CLASSES = ["14", "13з"];                    // страхование кредита: правила регулятора
const NEG_MODE = {"по согласованию":"ставка по согласованию с ЦО", "программа":"ставка по программе",
                  "генеральный договор":"ставка по генеральному договору"};
const REASONS = ["Конкурентное предложение", "Решение центрального офиса", "Требование банка",
                 "Пролонгация на прежних условиях", "Иная причина"];

// минимальный тариф: по типу клиента, иначе общий, иначе наибольший — как _pick в движке
function pickMin(rates, payer){
  if (!rates) return null;
  const keys = Object.keys(rates);
  if (!keys.length) return null;
  if (rates[payer] != null) return rates[payer];
  if (rates.any != null) return rates.any;
  return Math.max(...keys.map(k => rates[k]));
}
function minOf(code, payer){
  const p = PROD[code] || {};
  if (NEG_MODE[p.pricing_mode]) return {floor:null, source:null};
  const company = pickMin(p.min?.company, payer), regulator = pickMin(p.min?.regulator, payer);
  const vals = [company, regulator].filter(v => v != null);
  if (!vals.length) return {floor:null, source:null};
  const floor = Math.max(...vals);
  return {floor, source: regulator != null && floor === regulator ? "регулятор" : "компания"};
}
// зависит ли минимум продукта от того, юрлицо клиент или гражданин
const payerMatters = code => {
  const m = PROD[code]?.min || {};
  return ["company","regulator"].some(s => m[s] && ("юр" in m[s] || "физ" in m[s]));
};
const shortMin = code => {
  const p = PROD[code] || {};
  if (NEG_MODE[p.pricing_mode]) return NEG_MODE[p.pricing_mode];
  const legal = minOf(code, "юр").floor, person = minOf(code, "физ").floor;
  // обязательные виды: тариф установлен постановлением, в базе его нет
  if (legal == null && p.pricing_mode === "нормативный акт") return "ставка по нормативному акту";
  if (legal == null) return "минимум не задан";
  return payerMatters(code) ? `мин ${pc(person)} физ · ${pc(legal)} юр` : "мин " + pc(legal);
};

function defaultFactors(cls){
  const out = {};
  for (const f of factorsOf(cls)){
    const opts = optionsOf(cls, f);
    if (!opts.length) continue;
    // по умолчанию — вариант, ближайший к единице: обычный объект без скидок и надбавок
    out[f] = opts.reduce((a, b) => Math.abs(b.multiplier - 1) < Math.abs(a.multiplier - 1) ? b : a).option_code;
  }
  return out;
}
function defaultPerils(cls){
  return new Set(perilsOf(cls).filter(p => p.code !== "nuclear").map(p => p.code));
}

function selectProduct(code){
  const p = PROD[code]; if (!p) return;
  const b = document.getElementById("toContract");
  if (b && code !== OSGOR){ b.disabled = false; b.textContent = "В договор"; b.title = ""; }

  S.objectType = types[0] || "Объект";

    S.credit.loan = S.value;
    S.credit.collateral = Math.round(S.value * 0.6);

  }

  paintForm(); schedule(0);
}

/* ---------- запасной расчёт в браузере (когда сервер недоступен) ---------- */
function localCalc(){
  const cls = S.class_code;
  const rates = D.base_rates.filter(b => b.class_code === cls);
  const base = (rates.find(b => b.object_type === S.objectType)?.net_rate_pct)
            ?? (rates.length ? rates.reduce((s,b) => s + b.net_rate_pct, 0) / rates.length : 0.2);
  const chain = [{name: "Базовая нетто-ставка · " + S.objectType, value_pct: base}];
  const all = perilsOf(cls);
  let share = 1;
  if (all.length){
    const tot = all.reduce((s,p) => s + p.base_share, 0) || 1;
    share = all.filter(p => S.perils.has(p.code)).reduce((s,p) => s + p.base_share, 0) / tot;
    chain.push({name:"Набор рисков", mult: share, excluded: all.filter(p => !S.perils.has(p.code)).map(p => p.name)});
  }
  let net = base * Math.max(share, 0.001);
  for (const f of factorsOf(cls)){
    const opt = optionsOf(cls, f).find(c => c.option_code === S.factors[f]);
    if (!opt) continue;
    const applies = f !== "seismic" || S.perils.has("earthquake");
    const m = applies ? opt.multiplier : 1;
    net *= m;
    chain.push({name: opt.factor_name + " · " + opt.option_name, mult: m, applies});
  }
  const risk = net * RISK_LOAD;
  const cat = CAT_PERILS.some(c => S.perils.has(c)) ? net * 0.05 : 0;
  const gross = (net + risk + cat) / (1 - LOAD);
  chain.push({name:`Рисковая надбавка ${Math.round(RISK_LOAD*100)}%`, add_pct: risk});
  if (cat) chain.push({name:"Катастрофическая надбавка", add_pct: cat});
  chain.push({name:`Нагрузка ${Math.round(LOAD*100)}%`, divide_by: 1 - LOAD});

  const mr = minOf(S.product, S.payer);
  const auto = Math.max(gross, mr.floor || 0);
  const manual = S.manual.on && S.manual.rate > 0;
  const applied = manual ? S.manual.rate : auto;
  const premium = applied / 100 * S.sum * S.term / 365;
  const checks = [];
  const add = (rule, status, title, detail) => checks.push({rule, status, title, detail});
  if (manual) add("manual_rate", S.manual.reason ? "warn" : "stop",
    S.manual.reason ? "Ставка введена вручную" : "Ручная ставка без причины",
    S.manual.reason ? `Расчёт даёт ${pc(auto)}, поставлено ${pc(applied)}. Причина: ${S.manual.reason}.`
                    : "Укажите причину отступления от расчёта.");
  if (!CREDIT_CLASSES.includes(cls)){
    if (S.sum > S.value) add("sum_over_value","stop","Страховая сумма выше страховой стоимости",
      `Превышение ${fmt(S.sum - S.value)} сум. По ст. 938 ГК договор в этой части ничтожен.`);
    else if (S.sum < S.value) add("underinsurance","warn","Неполное страхование",
      `Сумма ${Math.round(S.sum/S.value*100)}% стоимости. По ст. 936 ГК выплата уменьшится в той же доле.`);
    else add("sum_ok","ok","Страховая сумма равна стоимости","Выплата будет полной.");
  } else {
    const cap = Math.min(Math.max(S.credit.loan - S.credit.collateral, 0), 0.5 * S.credit.loan);
    if (S.sum > cap) add("credit_uncovered","stop","Страховая сумма выше допустимой по кредиту",
      `Допустимо не более ${fmt(cap)} сум: необеспеченная часть и не выше 50% суммы кредита.`);
    else add("credit_uncovered","ok","Страховая сумма в пределах необеспеченной части", `Допустимо до ${fmt(cap)} сум.`);
    if (!S.credit.bank) add("credit_payer","stop","Страхователь или плательщик — не банк",
      "Страхователем выступает банк-кредитор, премия принимается только от банка.");
  }
  const mode = PROD[S.product]?.pricing_mode;
  if (NEG_MODE[mode]) add("pricing_mode","ok", NEG_MODE[mode][0].toUpperCase() + NEG_MODE[mode].slice(1),
    `Минимального тарифа по продукту нет. Техническая ставка ${pc(gross)} — ориентир.`);
  if (mr.floor != null) add("min_rate", applied + 1e-9 >= mr.floor ? "ok" : "stop",
    applied + 1e-9 >= mr.floor ? "Минимальный тариф соблюдён" : "Ставка ниже минимальной",
    `Минимум по продукту ${S.product} — ${pc(mr.floor)} (${mr.source}).`);
  add("below_technical", applied + 1e-9 >= gross ? "ok" : "warn",
    applied + 1e-9 >= gross ? "Ставка покрывает ожидаемые убытки" : "Ставка ниже технической",
    applied + 1e-9 >= gross ? `Техническая ставка ${pc(gross)}.` : `Не хватает ${pc(gross - applied)} — договор убыточен.`);
  const fin = D.financials;
  if (fin){
    const limit = 0.2 * (fin.own_funds + fin.reserves);
    add("risk_limit_20", S.sum <= limit ? "ok" : "stop",
      S.sum <= limit ? "Лимит на один риск соблюдён" : "Превышен лимит 20% на один риск",
      `Предел ${fmt(limit)} сум по данным на ${fin.report_date} (Положение 1806, п. 15).`);
  }
  const miss = docsOf(cls).filter(c => c.required && !S.docs.has(c.doc_name)).map(c => c.doc_name);
  if (miss.length) add("docs_missing","warn",`Не хватает документов: ${miss.length}`, miss.join("; "));
  else add("docs_ok","ok","Обязательные документы собраны","Расчёт можно передавать в договор.");
  if (factorsOf(cls).includes("franchise") && S.factors.franchise === "f0")
    add("no_franchise","warn","Франшиза не установлена","Мелкие убытки ложатся на компанию целиком.");
  if (!S.premiumPaid) add("premium_unpaid","warn","Премия не поступила",
    "По ст. 33¹ полис без уплаты премии обязывает страховщика полностью.");
  if (!S.disclosure) add("disclosure","warn","Клиенту не раскрыта информация",
    "Ст. 63: цена, покрытые и исключённые риски, возврат премии, порядок претензий.");
  const worst = checks.some(c=>c.status==="stop") ? "stop" : checks.some(c=>c.status==="warn") ? "warn" : "ok";
  return {rates:{net_pct:net, risk_load_pct:risk, cat_load_pct:cat, technical_pct:gross,
                 min_pct:mr.floor, min_source:mr.source, auto_pct:auto, applied_pct:applied, manual},
          premium, explanation:chain, checks, verdict:{ok:"ок",warn:"на утверждение",stop:"отклонено"}[worst],
          perils_included:[...S.perils], recommendations:[], preventive_measures:[], market:null};
}

/* ---------- запрос к серверу: тот же движок, что и в договоре ---------- */
function requestBody(){
  const cls = S.class_code;
  return {product_code: S.product, class_code: cls, object_type: S.objectType,
    value_amount: Math.max(S.value, 1), sum_insured: Math.max(S.sum, 1), term_days: Math.max(S.term, 1),
    factors: {...S.factors}, perils_included: perilsOf(cls).length ? [...S.perils] : null,
    docs_received: [...S.docs], payer_type: S.payer,
    applied_rate_pct: S.manual.on && S.manual.rate > 0 ? S.manual.rate : null,
    manual_reason: S.manual.reason, premium_paid: S.premiumPaid, disclosure_done: S.disclosure,
    valuation_id: S.val.valuation_id, object_key: S.val.object_key,
    credit: CREDIT_CLASSES.includes(cls)
      ? {loan_amount: Math.max(S.credit.loan, 1), collateral_value: S.credit.collateral,
         policyholder_is_bank: S.credit.bank, payer_is_bank: S.credit.bank} : null};
}
let timer = null, seq = 0;
function schedule(ms = 220){ clearTimeout(timer); timer = setTimeout(calc, ms); }
async function calc(){
  if (S.product === OSGOR) return runOsgor();      // премия по акту, другой расчёт
  const n = ++seq;
  try {
    const r = await fetch("/calculate", {method:"POST", headers:{"Content-Type":"application/json"},
                                         body: JSON.stringify(requestBody())});
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    if (n !== seq) return;
    S.source = "server"; S.last = j; paintSummary(j); paintResultCard(j);
  } catch (e) {
    if (n !== seq) return;
    S.source = "local";
    const j = localCalc(); S.last = j; paintSummary(j); paintResultCard(j);
  }
}

        </div>
        ${p.rate_text ? `<p class="hint" style="margin:8px 0 0">Тариф по политике: ${esc(p.rate_text)}</p>` : ""}
      </div>

function repaintPhotos(){
  const box = document.getElementById("photoCard");

  const tmp = document.createElement("div"); tmp.innerHTML = cardPhoto();
  box.replaceWith(tmp.firstElementChild);
}

async function loadPhotos(){
  if (!S.requestId) return;
  try {
    const r = await fetch("/requests/" + S.requestId + "/photos");
    if (!r.ok) throw new Error(r.status);
    S.serverPhotos = await r.json();
    S.photoError = "";
  } catch (e) {
    S.serverPhotos = [];
    S.photoError = "Список фотографий получить не удалось: сервер не ответил. Попробуйте ещё раз.";
  }
  repaintPhotos();
}

async function uploadPhotos(files){
  if (!S.requestId || !files.length) return;
  S.photoNote = `Отправляю на сервер: ${files.length}…`; S.photoError = ""; repaintPhotos();
  const fd = new FormData();
  for (const f of files) fd.append("files", f, f.name);
  try {
    const r = await fetch(`/requests/${S.requestId}/photos?who=${encodeURIComponent("экран агента")}`,
                          {method:"POST", body: fd});
    const j = await r.json().catch(() => ({}));
    if (!r.ok){
      S.photoNote = "";
      S.photoError = "Сервер не принял файлы: " + (j.detail || ("ошибка " + r.status))
        + ". Принимаются JPEG, PNG и WebP до 10 МБ.";
    } else {
      S.photoNote = `Загружено: ${(j.saved || []).length}`;
    }
  } catch (e) {
    S.photoNote = "";
    S.photoError = "Сервер не ответил, файлы не загружены. Проверьте связь и повторите.";
  }
  await loadPhotos();
}

async function deletePhoto(id){
  try {
    const r = await fetch(`/photos/${id}?who=${encodeURIComponent("экран агента")}`, {method:"DELETE"});
    if (!r.ok) throw new Error(r.status);
    S.photoError = "";
  } catch (e) { S.photoError = "Удалить не получилось: сервер не ответил."; }
  await loadPhotos();
}

// плашка источника: слева — чьими словами это написано, справа — путь к оригиналу
function srcBar(text, links, lead){
  const go = (links || []).filter(l => l && l.url).map(l =>
    `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}<span class="dom">${esc(l.domain)}</span></a>`).join("");
  return `<div class="srcbar"><p>${lead ? `<b>${esc(lead)}</b> ` : ""}${esc(text)}</p>`
       + (go ? `<div class="go">${go}</div>` : "") + `</div>`;
}
function hostOf(u){ try { return new URL(u).hostname.replace(/^www\./, ""); } catch(_) { return ""; } }

function valResultHtml(j){
  const e = j.explanation || {};
  const m = e.market || null;
  const kv = (k, val) => `<div><span>${k}</span><span class="v">${val}</span></div>`;
  const sum = x => x == null ? "—" : fmt(x) + " сум";
  const cmp = e.spread_check || {};
  const accepted = j.accepted === "цена агента" ? "Цена агента принята" : "Уточнённая стоимость";
  let h = `<h2 style="margin-top:22px">${accepted}: <span class="big">${sum(j.final_value)}</span></h2>
    <p class="sub">Метод: ${esc(j.method || "получить оценку не удалось")} · методика версии ${esc(j.method_version || "")}
      · на ${esc(j.as_of || "")}${j.id ? " · оценка № " + j.id : ""}</p>
    <div class="note ${j.accepted === "цена агента" ? "good" : ""}">${esc(cmp.text || "")}</div>`;

  if (j.spread) h += `<div class="wf" style="margin-top:14px">
      ${kv("Нижняя граница", sum(j.spread.min))}
      ${kv("Середина", sum(j.spread.median))}
      ${kv("Верхняя граница", sum(j.spread.max))}
      ${kv("Расчёт сервера", sum(j.ai_value))}
      ${kv("Заявлено агентом", sum(j.declared_value))}
      ${cmp.diff_pct != null ? kv("Расхождение", String(cmp.diff_pct).replace(".", ",") + "% при пороге "
          + String(cmp.threshold_pct ?? "").replace(".", ",") + "%") : ""}
    </div>`;

  if (m){
    h += `<h2 style="margin-top:22px">Рынок</h2>
      <p class="sub">${m.enough
        ? `Объявлений с ценой: ${m.prices_count} (всего найдено ${m.ads_count}), окно ${m.window_months} мес.
           с ${esc(m.window_from)} по ${esc(m.as_of)}.`
        : `Рынок не использован: ${esc(m.reason || "нет данных")}`}</p>`;
    if (m.median != null) h += `<div class="wf">
        ${kv("Медиана объявлений", sum(m.median))}
        ${kv("Q1 — Q3", sum(m.q1) + " — " + sum(m.q3))}
        ${kv("Скидка на торг", String(m.bargain_pct).replace(".", ",") + "%")}
        ${kv("Рыночная стоимость", sum(m.value))}
      </div>`;
    h += `<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px">Источники</h3>
      <ul class="srcs">${(j.sources || []).map(s => `<li class="${s.status === "ок" ? "ok" : "bad"}">
        <i class="dot"></i><div><div class="nm">${esc(s.source)}: ${esc(s.status)}${
          s.ads_count ? ` · объявлений ${s.ads_count}` : ""}</div>
        ${s.reason ? `<div class="why">${esc(s.reason)}</div>` : ""}
        ${s.url ? `<div class="why"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a></div>` : ""}
        </div></li>`).join("") || `<li><i class="dot"></i><div class="nm">Площадки по этому типу объекта не опрашиваются.</div></li>`}</ul>`;
    if ((m.samples || []).length) h += `<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px">${

      <ul class="ads">${m.samples.map(s => `<li>

      + srcBar("Расчёт подготовлен системой по нормам амортизации компании (линейный метод):"
        + " это не документ компании. Нормы и остаточные минимумы — в справочнике.",

  if ((e.expert_values || []).length) h += `<div class="note"><span class="pill">не откалибровано</span>

  if ((e.legal || []).length) h += `<details style="margin-top:14px"><summary class="hint" style="cursor:pointer">На чём это основано</summary>

function valBody(){
  const v = S.val, k = VAL_KINDS[v.kind];
  const num = x => { const n = Number(String(x).replace(",", ".")); return x === "" || x == null || isNaN(n) ? null : n; };
  const params = {...k.params};
  if (isCar()){
    if (v.brand) params.brand = v.brand.trim();
    if (v.model) params.model = v.model.trim();
    if (num(v.year)) params.year = num(v.year);
    if (v.region) params.region = v.region.trim();
    if (num(v.mileage_km)) params.mileage_km = num(v.mileage_km);
  }
  if (isRealty()){
    if (v.city){ params.city = v.city.trim(); params.region = v.city.trim(); }
    if (v.region) params.region = v.region.trim();
    if (v.district) params.district = v.district.trim();
    if (num(v.area_m2)) params.area_m2 = num(v.area_m2);
    if (num(v.rooms)) params.rooms = num(v.rooms);
  }
  return {object_type: k.object_type, params,
          as_of: v.as_of || null,
          declared_value: num(v.declared),
          norm_code: v.norm_code || null,
          initial_value: num(v.initial_value),
          commissioned_at: v.commissioned_at || null,
          mileage_km: num(v.mileage_km),
          request_id: S.requestId, save: true, created_by: "экран агента"};
}

async function runValuation(){
  S.val.busy = true; S.val.error = ""; repaintValResult();
  try {
    const r = await fetch("/valuations/estimate", {method:"POST", headers:{"Content-Type":"application/json"},
                                                   body: JSON.stringify(valBody())});
    const j = await r.json().catch(() => ({}));
    if (!r.ok){
      S.val.result = null;
      S.val.error = r.status === 404
        ? "Сервер не знает про расчёт стоимости: открыт старый экран или сервер работает на старой версии. Перезапустите сервер."
        : "Сервер не посчитал: " + (j.detail || ("ошибка " + r.status));
    } else {
      S.val.result = j;
      // запомнили оценку: движок сверит с ней страховую сумму (ГК ст. 934, 936, 938)
      S.val.valuation_id = j.id ?? null;
      S.val.object_key = j.object_key ?? null;
    }
  } catch (e) {
    S.val.result = null;
    S.val.error = "Сервер не ответил. Стоимость считает сервер, в браузере расчёта нет — повторите позже.";
  }
  S.val.busy = false; repaintValResult();
  if (S.val.valuation_id || S.val.object_key) schedule(0);   // проверки пересчитать с оценкой
}

/* ---------- документ объекта: техпаспорт и кадастр ---------- */
// Какие поля разбора сервер отдаёт «для оценки» и в какое поле формы они ложатся.
// Имена слева — ключи ответа сервера (app/docparse.py, «для_оценки»), не выдуманные.
const DOC_MAP = {
  "техпаспорт": {"марка":"brand", "модель":"model", "год":"year", "регион":"region", "vin":"vin"},
  "кадастр":    {"адрес":"address", "площадь":"area_m2", "комнаты":"rooms", "тип":"object_kind",
                 "регион":"region"}
};
// ключи полей разбора, которые уже попали в форму: остальное показываем списком «ещё в документе»
const DOC_SHOWN = {
  "техпаспорт": ["brand", "model", "year", "region", "vin"],
  "кадастр":    ["address", "area_m2", "rooms", "object_kind", "region"]
};
const docKind = () => isCar() ? "техпаспорт" : (isRealty() ? "кадастр" : null);
const cap = t => t ? t[0].toUpperCase() + t.slice(1) : "";

function srcTag(k){
  const from = S.fromDoc[k];
  return `<b class="src${from ? " on" : ""}" id="src-${k}">${from === "распознавание" ? "распознано" : "из документа"}</b>`;
}
// поле, которого в документе нет: говорим об этом, когда документ разобран, а сервер поля не вернул
function missingHint(key){
  const p = S.doc.parsed;
  if (!p || S.doc.kind !== "кадастр" || !isRealty()) return "";
  const fv = p["для_оценки"] || {};
  if (key === "rooms" && !fv["комнаты"])
    return "в кадастре числа комнат нет — возьмите из плана-экспликации или замера";
  if (key === "build_year" && !fv["год"])
    return "в кадастре года постройки нет — нужна справка балансодержателя; с этой даты считается износ";
  return "";
}

function docBlock(){
  const kind = docKind();
  if (!kind) return "";
  const d = S.doc, hasId = !!S.requestId;
  let h = `<div class="photozone" style="margin-top:14px">
    <label class="upload"><input type="file" id="docInput" accept="application/pdf,image/jpeg,image/png,image/webp"${hasId && !d.busy ? "" : " disabled"}>
      <span>${kind === "техпаспорт" ? "Загрузить техпаспорт" : "Загрузить кадастр"}</span></label>
    <span class="hint">${d.busy ? "Отправляю документ на сервер…" : esc(d.note)}</span></div>
  <p class="hint" style="margin:8px 0 0">PDF или фотография, до 10 МБ. Сервер прочитает документ и подставит
    характеристики объекта в поля ниже. ФИО, паспорт, ПИНФЛ и адрес владельца из документа не берутся
    и в базу не попадают (ЗРУ-547, ст. 4 и 10).</p>`;
  if (!hasId) h += `<div class="note">Пока запрос не сохранён, документ загружать некуда. Нажмите справа
    <b>«В договор»</b> — расчёт получит номер, и кнопка заработает.</div>`;
  if (d.error) h += `<div class="note bad">${esc(d.error)}</div>`;

function docPanel(p){
  const kind = S.doc.kind || p["вид_документа"] || "документ";
  const st = p["статус"] || "";
  const ok = st === "разобран" || st === "частично";
  const head = ok ? `${cap(kind)} разобран: нашли ${p["найдено_полей"]} из ${p["всего_полей"]} полей.`
                  : `${cap(kind)}: ${st}.`;
  let h = `<div class="docpanel"><h3>Что сервер прочитал в документе</h3>
    <p style="margin:0 0 8px;font-size:13.5px"><b>${esc(head)}</b>${p["из_кэша"] ? " Разбор взят из базы: этот файл уже разбирали." : ""}</p>`;
  if (p["примечание"]) h += `<div class="note${ok ? "" : " bad"}" style="margin-top:0">${esc(p["примечание"])}</div>`;
  if (st === "нужно распознавание"){
    h += SAMPLE
      ? `<div class="photozone" style="margin-top:10px">
          <button type="button" class="act" id="docRecog"${S.doc.recogBusy ? " disabled" : ""}>${S.doc.recogBusy ? "Распознаю…" : "Распознать документ"}</button>
          <span class="hint">Распознаёт Claude — только в этом опубликованном экране. Проверьте каждое значение.</span></div>`
      : `<div class="note">Распознавания текста в этом окне <b>нет</b>: оно работает только в опубликованном
          экране (артефакт с разрешением на обращение к Claude). Здесь заполните поля ниже руками —
          система ничего не угадывает.</div>`;
  }
  const done = Object.keys(p["для_оценки"] || {});
  if (done.length) h += `<p style="margin:8px 0 0;font-size:13px">Подставлено в форму: <b>${done.map(esc).join(", ")}</b>.
    Если в документе опечатка — поправьте поле руками, пометка «из документа» снимется.</p>`;
  const rest = (p["поля"] || []).filter(f => f["значение"] && !(DOC_SHOWN[kind] || []).includes(f["поле"]));
  if (rest.length) h += `<h3>Ещё в документе</h3><dl class="kvs">` + rest.map(f =>
    `<dt>${esc(f["название"])}</dt><dd>${esc(String(f["значение"]))}</dd>`).join("") + `</dl>`;
  const w = p["предупреждения"] || [];
  if (w.length) h += `<h3>На что смотреть</h3>` + w.map(x => {
    const lvl = x["уровень"] === "стоп" ? "stop" : (x["уровень"] === "предупреждение" ? "warn" : "ok");
    return `<div class="chk ${lvl}"><span class="dot"></span><span><span class="t">${esc(x["текст"])}</span><br>
      <span class="d">${esc(x["код"] || "")}${x["норма"] ? " · " + esc(x["норма"]) : ""}</span></span></div>`;
  }).join("");
  const cl = p["чек_лист"];
  if (cl) h += cl["отмечен"]
    ? `<div class="note good">Пункт чек-листа «${esc(cl["пункт"])}» отмечен полученным.</div>`
    : `<div class="note">Пункт чек-листа не отмечен: ${esc(cl["причина"] || "сервер не сказал почему")}</div>`;
  if (p["сверено_с_бланком"] === false) h += `<p class="hint" style="margin:10px 0 0">Подписи граф собраны по
    нормативным актам, с образцом бланка не сверены. Если поле подставилось не тем — исправьте руками и скажите нам.</p>`;
  if (p["персональные_данные"]) h += `<p class="hint" style="margin:6px 0 0">${esc(p["персональные_данные"])}</p>`;
  return h + `</div>`;
}

function applyParsed(p, kind){
  S.doc.parsed = p; S.doc.kind = kind;
  if (!p){ S.doc.note = "Документ загружен, сервер его не разбирал."; return; }
  const fv = p["для_оценки"] || {}, map = DOC_MAP[kind] || {};
  let n = 0;
  for (const ru of Object.keys(map)){
    const val = fv[ru];
    if (val == null || val === "") continue;
    S.val[map[ru]] = String(val);
    S.fromDoc[map[ru]] = "документ";
    n++;
  }
  S.doc.note = n ? `Из документа подставлено полей: ${n}` : "Из документа в форму ничего не подставилось";
  const cl = p["чек_лист"];
  if (cl && cl["отмечен"] && cl["пункт"]) S.docs.add(cl["пункт"]);   // отметку ставит сервер, экран её показывает
}

async function uploadDoc(file){
  const kind = docKind();
  if (!kind || !S.requestId || !file) return;
  S.doc.busy = true; S.doc.error = ""; S.doc.note = ""; S.doc.file = file; repaintValue();
  const fd = new FormData(); fd.append("files", file, file.name);
  const url = `/requests/${S.requestId}/documents/upload?doc_kind=${encodeURIComponent(kind)}`
            + `&who=${encodeURIComponent("экран агента")}`;
  try {
    const r = await fetch(url, {method:"POST", body: fd});
    const j = await r.json().catch(() => ({}));
    if (!r.ok){
      S.doc.parsed = null;
      S.doc.error = r.status === 404
        ? "Сервер не знает про загрузку документов: открыт старый экран или сервер работает на старой версии. Перезапустите сервер."
        : "Сервер не принял документ: " + (j.detail || ("ошибка " + r.status))
          + ". Принимаются PDF, JPEG, PNG и WebP до 10 МБ.";
    } else {
      applyParsed((j.saved || [])[0]?.["разбор"] || null, kind);
    }
  } catch (e) {
    S.doc.parsed = null;
    S.doc.error = "Сервер не ответил, документ не загружен. Проверьте связь и повторите.";
  }
  S.doc.busy = false;
  paintForm(); schedule(0);       // поля и отметка в чек-листе обновились, проверки пересчитываем
}

// Распознавание скана. Работает только в опубликованном экране: там есть разрешение на обращение к Claude.
async function recognizeDoc(){
  const kind = S.doc.kind, f = S.doc.file;
  if (!SAMPLE || !kind || !f) return;
  if (f.type === "application/pdf"){
    S.doc.error = "Распознать можно фотографию или снимок экрана документа. PDF без текстового слоя здесь не читается — заполните поля руками.";
    repaintValue(); return;
  }
  S.doc.recogBusy = true; S.doc.error = ""; repaintValue();
  const keys = Object.keys(DOC_MAP[kind]);
  const prompt =
`Ты помогаешь страховому сюрвейеру прочитать документ на объект страхования (${kind}, Узбекистан).
Верни ТОЛЬКО JSON с ключами: ${keys.map(k => '"' + k + '"').join(", ")}.
Бери значения строго из документа. Чего в документе не видно — ставь null, не угадывай.
${kind === "техпаспорт"
  ? 'Пробег не бери: в техпаспорте его нет. "год" — год выпуска четырьмя цифрами, "регион" — область или город Ташкент.'
  : '"площадь" — в кв. м числом, "комнаты" — числом, "тип" — вид объекта недвижимости, "адрес" — местонахождение объекта.'}
Персональные данные не извлекай и не пиши в ответ: ФИО, ПИНФЛ, паспорт, ИНН, адрес и подпись владельца (ЗРУ-547, ст. 4 и 10).`;
  try {
    const res = await SAMPLE.json(prompt, {images: [f], modelTier: "default"});
    const map = DOC_MAP[kind]; let n = 0;
    for (const ru of keys){
      const val = res?.[ru];
      if (val == null || val === "") continue;
      S.val[map[ru]] = String(val); S.fromDoc[map[ru]] = "распознавание"; n++;
    }
    S.doc.note = n ? `Распознано полей: ${n}. Проверьте каждое: это чтение снимка, а не документ.`
                   : "По этому снимку прочитать ничего не удалось — заполните поля руками.";
  } catch (e) {
    S.doc.error = {not_granted:"Доступ к Claude не разрешён — заполните поля руками.",
      images_unavailable:"В этом окне файл недоступен.",
      image_rejected:"Файл не подошёл: нужен jpg или png поменьше.",
      rate_limited:"Слишком много запросов подряд, попробуйте через минуту.",
      invalid_json:"Ответ не удалось разобрать, попробуйте снимок почётче."}[e?.code]
      || "Распознать не получилось, заполните поля руками.";
  }
  S.doc.recogBusy = false; repaintValue();
}

/* ---------- кто согласует запрос ----------
   Запрос по генеральному соглашению рассматривает не один человек, а 2–3: их выбирает агент.
   Ограничения на состав (юрист): страховой агент согласующим быть не может (Положение 3845, п. 2);
   согласующий — только работник компании (тайна страхования, ЗРУ-730, ст. 62);
   инициатор сам себя не согласует (внутреннее правило). */
function revBlocked(u){
  if (u.role === "агент") return "агент не согласует — он посредник (Положение 3845, п. 2)";
  if (S.rev.me && u.id === S.rev.me.id) return "это вы — инициатор сам себя не согласует";
  return null;
}

    return `<label class="switch"${why ? ' style="opacity:.5"' : ""}>

        ${why ? `<em style="color:var(--warn)"> · ${esc(why)}</em>` : ""}</span></label>`;
  }).join("");

  box.innerHTML = `<h2>Кто согласует запрос</h2>
    <p class="sub">Запрос уходит сразу 2–3 людям. Решение каждого видно в разделе «Согласования».</p>
    <div class="row">
      <label class="f"><span>Генеральное соглашение</span>
        <select id="revAgreement"><option value="">нет, обычный запрос</option>${opts}</select>

        : "<b>не предоставлены</b> — запрошены у заказчика, ставку и состав проверяйте вручную"}.
        Состав по умолчанию: ${a.default_reviewers && a.default_reviewers.length
        ? esc(String(a.default_reviewers.length)) + " чел." : "<b>не задан</b> — выберите людей сами"}.</p>` : ""}
    ${R.users.length ? `<div style="margin-top:12px;display:grid;gap:7px">${people}</div>`
      : `<p class="hint" style="margin-top:10px;color:var(--stop)">${esc(R.error
          || "В базе нет действующих работников — согласующих выбрать не из кого. Зарегистрируйте сотрудников на странице входа.")}</p>`}
    <p class="hint" style="margin-top:10px">Выбрано ${R.picked.length} из 2–3.
      ${R.picked.length < 2 ? "Добавьте ещё — меньше двух запрос не отправить." : ""}
      ${R.picked.length >= 3 ? "Больше трёх нельзя — снимите отметку, чтобы поменять человека." : ""}</p>
    ${R.note ? `<p class="hint" style="margin-top:6px"><b>${esc(R.note)}</b></p>` : ""}`;
}

async function loadReviewers(){
  const R = S.rev;
  if (R.loaded) return;
  R.loaded = true;
  try { R.users = await (await fetch("/auth/colleagues")).json(); }
  catch (e){ R.users = []; R.error = "Список работников не загрузился — сервер не ответил."; }
  try { R.agreements = await (await fetch("/general-agreements")).json(); } catch (e){ R.agreements = []; }
  try { R.me = await (await fetch("/auth/me")).json(); } catch (e){ R.me = null; }
  if (!Array.isArray(R.users)) R.users = [];
  if (!Array.isArray(R.agreements)) R.agreements = [];
  paintReviewers();
}

// состав по умолчанию из соглашения: там либо user_id, либо ФИО — сопоставляем со справочником
function applyAgreement(id){
  const R = S.rev;
  R.agreement = id;
  R.note = "";
  const a = R.agreements.find(x => String(x.id) === String(id));
  if (!a) { paintReviewers(); return; }
  const want = (a.default_reviewers || []).map(v => R.users.find(u => u.id === v || u.login === v || u.full_name === v))
                                          .filter(u => u && !revBlocked(u));
  if (want.length){
    R.picked = want.slice(0, 3).map(u => u.id);
    R.note = "Состав подставлен из соглашения — его можно изменить.";
  } else if ((a.default_reviewers || []).length){
    R.note = "Состав из соглашения не подставился: этих людей нет в справочнике работников.";
  }
  paintReviewers();
}

// отправка состава на сервер после сохранения запроса
async function sendReviewers(rid){
  const R = S.rev;
  if (R.picked.length < 2) return "состав согласующих не отправлен — выбрано меньше двух человек";
  try {
    const r = await fetch(`/requests/${rid}/reviewers`, {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({user_ids: R.picked, who: R.me ? R.me.login : "экран агента",
                            general_agreement_id: R.agreement ? Number(R.agreement) : null})});
    const j = await r.json();
    return r.ok ? `на согласование: ${R.picked.length} чел.` : "состав не назначен: " + (j.detail || r.status);
  } catch (e){ return "состав не назначен — сервер не ответил"; }
}

  box.replaceWith(tmp.firstElementChild);
}

  const box = document.getElementById("vehResult");
  if (box) box.innerHTML = S.veh.result ? vehResultHtml(S.veh.result) : "";
  const err = document.querySelector("#vehCard .note.bad");
  if (err && !S.veh.error) err.remove();

function vehBody(){
  const v = S.veh;
  const num = x => { const n = Number(String(x).replace(",", ".")); return x === "" || x == null || isNaN(n) ? null : n; };
  const tri = x => x === "да" ? true : x === "нет" ? false : null;
  return {type_text: v.type_text, doc_kind: v.doc_kind, plate: v.plate, brand: v.brand, model: v.model,
          self_propelled: tri(v.self_propelled), max_speed_kmh: num(v.max_speed_kmh),
          place: v.place, purpose: "", region: v.region,
          on_truck_chassis: v.group === "спецтехника на шасси грузовика" ? true : null,
          takaful: /такафул/i.test(PROD[S.product]?.name || ""), group: v.group || null};
}

let vehTimer = null;
function scheduleVeh(ms = 350){ clearTimeout(vehTimer); vehTimer = setTimeout(runVeh, ms); }

async function runVeh(){
  const v = S.veh;
  const known = [v.brand, v.model, v.type_text].some(x => String(x).trim());
  if (!known && !v.group){ v.result = null; repaintVehResult(); return; }
  try {
    const r = await fetch("/vehicle/classify", {method:"POST", headers:{"Content-Type":"application/json"},
                                                body: JSON.stringify(vehBody())});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(r.status === 404 ? "404" : (j.detail || r.status));
    const wasSpec = vehIsSpec();
    v.result = j; v.error = "";
    if (wasSpec !== SPEC_GROUPS.includes(j.result?.group || "")) repaintVeh();
    else repaintVehResult();
  } catch (e) {
    v.result = null;
    v.error = String(e.message) === "404"
      ? "Сервер не знает про классификатор техники: открыт старый экран или сервер работает на старой версии. Перезапустите сервер."
      : "Сервер не разобрал карточку объекта: " + esc(String(e.message)) + ". Повторите позже.";
    repaintVeh();
  }
}

// год выпуска → возраст машины: фактор veh_age есть в справочнике, он ставку меняет
function syncVehYear(){
  const y = Number(S.veh.year);
  if (!y || y < 1970 || y > 2100 || S.class_code !== "3") return;
  const age = new Date().getFullYear() - y;
  const code = age <= 3 ? "a3" : age <= 7 ? "a7" : "a7p";
  if (optionsOf("3", "veh_age").some(c => c.option_code === code) && S.factors.veh_age !== code){
    S.factors.veh_age = code;
    const sel = document.querySelector('select[data-factor="veh_age"]');
    if (sel) sel.value = code;
    schedule(0);
  }
}

let actTimer = null;
function scheduleActs(){ clearTimeout(actTimer); actTimer = setTimeout(loadActivities, 320); }
async function loadActivities(){
  const g = S.osg, q = g.q.trim();
  if (q.length < 2){ g.hits = null; g.hitsNote = ""; repaintOsgHits(); return; }
  try {
    const r = await fetch("/osgor/activities?limit=12&q=" + encodeURIComponent(q));
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    g.hits = j.items || [];
    g.hitsNote = g.hits.length ? "" : `В классификации такого вида нет. Если он там и не найдётся,
      применяется коэффициент ${String(j.not_listed_kst ?? "").replace(".", ",")} (прил. № 9, разд. I, п. 6) —
      проверьте код ОКЭД в заявлении.`;
  } catch (e) {
    g.hits = null;
    g.hitsNote = String(e.message) === "404"
      ? "Сервер не знает про справочник ОСГОР: перезапустите сервер, код уже готов."
      : "Справочник видов деятельности не загрузился — сервер не ответил.";
  }
  repaintOsgHits();
}

let osgTimer = null;
function scheduleOsgor(ms = 350){ clearTimeout(osgTimer); osgTimer = setTimeout(runOsgor, ms); }

function osgBody(){
  const g = S.osg;
  const int0 = k => Math.max(0, Math.round(osgNum(g[k]) || 0));
  const share = k => Math.min(1, Math.max(0, (osgNum(g[k]) || 0) / 100));
  return {okved: String(g.okved || ""), activity_name: String(g.activity_name || ""),
          headcount: int0("headcount"), payroll_12m: osgNum(g.payroll_12m) || 0,
          share_harmful: share("share_harmful"), share_dangerous: share("share_dangerous"),
          attestation_done: !!g.attestation_done, accidents_3y: int0("accidents_3y"),
          severe_3y: int0("severe_3y"), fatal_3y: int0("fatal_3y"),
          safety_service: !!g.safety_service, training_done: !!g.training_done,
          ppe_provided: !!g.ppe_provided, labour_inspection_orders: int0("labour_inspection_orders"),
          wage_arrears: !!g.wage_arrears, budget_funded: !!g.budget_funded,
          term_days: Math.min(365, Math.max(1, int0("term_days") || 365)),
          activity_shorter_than_year: (osgNum(g.term_days) || 365) < 365,
          premium_paid: S.premiumPaid, docs_received: [...S.docs],
          brv: osgNum(g.brv), declared_sum: osgNum(g.declared_sum)};
}

async function runOsgor(){
  const g = S.osg;
  if (!(osgNum(g.payroll_12m) > 0)){
    g.result = null; g.error = ""; repaintOsgResult(); paintOsgorEmpty(); return;
  }
  try {
    const r = await fetch("/osgor/assess", {method:"POST", headers:{"Content-Type":"application/json"},
                                            body: JSON.stringify(osgBody())});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(r.status === 404 ? "404" : (j.detail || r.status));
    g.result = j; g.error = "";
    g.kst = j.activity?.kst ?? null; g.category = j.activity?.category ?? null;
    repaintOsgResult(); paintOsgorSummary(j);
  } catch (e) {
    g.result = null;
    g.error = String(e.message) === "404"
      ? "Сервер не знает про расчёт ОСГОР: открыт старый экран или сервер работает на старой версии. Перезапустите сервер."
      : "Сервер не посчитал ОСГОР: " + String(e.message) + ". Повторите позже.";
    repaintOsgor(); paintOsgorEmpty();
  }
}

function paintOsgorSummary(j){
  const p = j.premium, a = j.assessment, d = j.decision;
  document.getElementById("premium").innerHTML = fmt(p.premium) + ' <small>сум</small>';
  document.getElementById("rate").textContent = p.rate_pct_of_payroll.toFixed(4).replace(".", ",") + "%";
  document.getElementById("rateNote").textContent = "от фонда оплаты труда, по ПКМ № 177"
    + (p.min_applied ? " · поднята до минимума 0,25 БРВ" : "");
  const lr = a.expected_loss_ratio * 100;
  document.getElementById("fill").style.width = Math.min(100, lr / 1.5) + "%";
  document.getElementById("mMin").textContent = "рынок " + (a.market_loss_ratio * 100).toFixed(1).replace(".", ",") + "%";
  document.getElementById("mTech").textContent = "ожидаем " + lr.toFixed(0) + "%";
  document.getElementById("mMax").textContent = "порог 100%";
  document.getElementById("market").innerHTML =
    `Шкала показывает не ставку, а ожидаемую убыточность договора: вилки ставки в ОСГОР нет.`;

  const v = document.getElementById("verdict");
  const worst = d.decision === "принять" ? "ok" : d.decision === "передать андеррайтеру" ? "stop" : "warn";
  v.className = "verdict " + worst;
  v.textContent = d.decision === "принять" ? "Принять: замечаний нет"
    : d.decision === "передать андеррайтеру" ? "Передать андеррайтеру" : "Принять с мероприятиями";

  document.getElementById("wf").innerHTML = p.steps.map(s =>
    `<div><span>${esc(s["шаг"])}</span><span class="v">${esc(s["значение"])}</span></div>`).join("")
    + `<div class="total"><span>Ожидаемая убыточность</span><span class="v ${lr > 100 ? "up" : "down"}">`
    + lr.toFixed(0) + `%</span></div>`;

  document.getElementById("checks").innerHTML = j.checks.map(c => {
    const st = c.severity === "стоп" ? "stop" : c.severity === "предупреждение" ? "warn" : "ok";
    return `<div class="chk ${st}"><i class="dot"></i><div><div class="t">${esc(c.code)}</div>`
      + `<div class="d">${esc(c.text)}</div></div></div>`;
  }).join("");

  document.getElementById("tips").innerHTML =
    `<p class="hint" style="margin:0">Цену по ОСГОР изменить нельзя: базовая ставка 0,1 % и коэффициент
      вида деятельности установлены ПКМ № 177, отступать от них страховщик не вправе (ЗРУ-210 ст. 8 ч. 4).
      Снизить можно только ожидаемые выплаты — мероприятиями ниже.</p>`;

  const ms = j.measures || [];
  document.getElementById("msec").hidden = !ms.length;
  document.getElementById("measures").innerHTML = ms.map(m =>
    `<div class="measure"><b>${esc(m.measure)}</b>`
    + `<span class="lbl ${m.mandatory?"must":""}">${m.mandatory ? "условие договора · " + m.deadline_days + " дн." : "рекомендация"}</span>`
    + `<small>${esc(m.why)}</small></div>`).join("");
  osgorActions();
}

/* ---------- панель расчёта ---------- */
function paintSummary(j){
  const r = j.rates;
  const applied = r.applied_pct, tech = r.technical_pct, floor = r.min_pct ?? 0;
  document.getElementById("premium").innerHTML = fmt(j.premium) + ' <small>сум</small>';
  document.getElementById("rate").textContent = pc(applied);
  document.getElementById("rateNote").textContent = r.manual ? T("calc.rate_manual_flag", "введена вручную")
    : applied > tech + 1e-9 ? T("calc.rate_raised_to_min", "поднята до минимального тарифа")
    : T("calc.rate_is_technical", "техническая");
  const max = Math.max(tech, floor) * 1.6 || 1;
  document.getElementById("fill").style.width = Math.min(100, applied / max * 100) + "%";
  document.getElementById("mMin").textContent = r.min_pct == null ? T("calc.rate_min_none", "минимума нет")
    : T("calc.rate_min", "мин") + " " + pc(floor);
  document.getElementById("mTech").textContent = T("calc.rate_tech", "тех") + " " + pc(tech);
  document.getElementById("mMax").textContent = T("calc.rate_max", "макс") + " " + pc(max);

  const mk = document.getElementById("market");
  if (j.market){
    const d = j.market.deviation_pct;
    mk.innerHTML = `Рынок: <b style="font-family:var(--mono);color:var(--ink)">${pc(j.market.rate_pct)}</b> `
      + `(${esc(j.market.label)}) — вы <b style="color:${d>=0?"var(--ok)":"var(--stop)"}">${d>=0?"дороже":"дешевле"} `
      + `на ${Math.abs(d).toFixed(0)}%</b>, убыточность рынка ${j.market.loss_ratio.toFixed(1).replace(".", ",")}%`;
  } else mk.textContent = T("calc.market_none", "Рыночной ставки по этому классу в отчётах НАПП нет.");

  const worst = j.checks.some(c=>c.status==="stop") ? "stop" : j.checks.some(c=>c.status==="warn") ? "warn" : "ok";
  const v = document.getElementById("verdict");
  v.className = "verdict " + worst;
  v.textContent = worst === "stop" ? "Нельзя оформлять: есть нарушения"
                : worst === "warn" ? "Можно оформить, но нужно решение андеррайтера"
                : "Проверки пройдены — можно оформлять";

  document.getElementById("wf").innerHTML = j.explanation.map(c => {
    if (c.value_pct != null) return `<div><span>${esc(c.name)}</span><span class="v">${pc(c.value_pct)}</span></div>`;
    if (c.add_pct != null) return `<div><span>${esc(c.name)}</span><span class="v up">+${pc(c.add_pct)}</span></div>`;
    if (c.divide_by != null) return `<div><span>${esc(c.name)}</span><span class="v up">делим на ${Number(c.divide_by).toFixed(2).replace(".", ",")}</span></div>`;
    const m = c.mult;
    return `<div${c.applies === false ? ' style="opacity:.45"' : ""}><span>${esc(c.name)}</span>`
         + `<span class="v ${m>1?"up":m<1?"down":""}">×${Number(m).toFixed(2)}</span></div>`;
  }).join("")
  + `<div class="total"><span>${r.manual ? "Расчётная ставка" : "Ставка"}</span><span class="v">${pc(r.auto_pct)}</span></div>`
  + (r.manual ? `<div class="total"><span>Поставлено вручную</span>`
      + `<span class="v ${applied < r.auto_pct ? "down" : "up"}">${pc(applied)}</span></div>` : "");

  document.getElementById("checks").innerHTML = j.checks.map(c =>
    `<div class="chk ${c.status}"><i class="dot"></i><div><div class="t">${esc(c.title)}</div>`
    + `<div class="d">${esc(c.detail)}</div></div></div>`).join("");

  const tips = j.recommendations || [];
  window.__tips = tips;
  document.getElementById("tips").innerHTML = tips.length
    ? tips.map((t,i) => `<div class="tip"><span>${esc(t.text)}</span>`
        + `<span class="save">${fmt(t.premium_delta)}</span>`
        + `<button type="button" data-tip="${i}">применить</button></div>`).join("")
    : `<p class="hint" style="margin:0">${S.source === "local"
        ? "Сервер недоступен: подсказки считает движок, откройте экран через приложение."
        : "Дешевле уже не сделать без потери защиты."}</p>`;

  const ms = j.preventive_measures || [];
  document.getElementById("msec").hidden = !ms.length;
  document.getElementById("measures").innerHTML = ms.map(m =>
    `<div class="measure"><b>${esc(m.measure)}</b>`
    + `<span class="lbl ${m.mandatory?"must":""}">${m.mandatory ? "условие договора · " + m.deadline_days + " дн." : "рекомендация"}</span>`
    + `<small>${esc(m.why)}${m.premium_delta != null ? " · " + fmt(m.premium_delta) + " сум к премии" : ""}</small></div>`).join("");

  const vh = document.getElementById("valueHint"), sh = document.getElementById("sumHint");
  if (vh) vh.textContent = fmt(S.value) + " сум";
  if (sh) sh.textContent = fmt(S.sum) + " сум";
  const note = document.getElementById("rateNote");
  if (S.source === "local") note.textContent += " · расчёт в браузере, сервер не ответил";
}

/* ---------- распознавание по фотографии ---------- */
let SAMPLE = null, IMG_LIMITS = null;
window.claude?.use?.("sample")?.then?.(async s => {
  SAMPLE = s;
  if (s) IMG_LIMITS = (await s.limits().catch(() => null))?.images ?? null;
  paintForm();
}).catch(() => {});

function optionsText(f){ return optionsOf(S.class_code, f).map(c => `${c.option_code} — ${c.option_name}`).join("; "); }

async function analyzePhotos(){
  if (!SAMPLE || !IMG_LIMITS || !S.photos.length) return;
  S.photoNote = "Смотрю фотографии…"; paintForm();
  const types = [...new Set(objectTypesOf(S.class_code))];
  const prompt =
`Ты помогаешь страховому сюрвейеру осмотреть объект по фотографиям.
Определи по снимкам характеристики объекта и верни ТОЛЬКО JSON вида
{"objectType":"…","construction":"…","activity":"…","protection":"…","wear":"…","observations":["…"],"confidence":"высокая|средняя|низкая"}

Допустимые значения:
objectType: ${types.join("; ")}
construction: ${optionsText("construction")}
activity: ${optionsText("activity")}
protection: ${optionsText("protection")}
wear: ${optionsText("wear")}

Значения полей construction, activity, protection, wear — только коды из списков выше.
observations — до пяти коротких наблюдений на русском о состоянии, видимых факторах риска
(состояние кровли и проводки, горючие материалы, захламлённость, отсутствие огнетушителей,
трещины, соседняя застройка). Если чего-то не видно на фото — не выдумывай, пиши, что не видно.`;
  try {
    const res = await SAMPLE.json(prompt, {images: S.photos.slice(0, IMG_LIMITS.maxCount), modelTier: "default"});
    const applied = [];
    const setIf = (key, label) => {
      const val = res?.[key]; if (!val) return;
      if (key === "objectType"){
        if (!types.includes(val)) return;
        S.objectType = val; applied.push({label, value: val}); return;
      }
      const opt = optionsOf(S.class_code, key).find(c => c.option_code === val);
      if (!opt) return;
      S.factors[key] = val; applied.push({label, value: opt.option_name});
    };
    setIf("objectType", "Тип объекта"); setIf("construction", "Конструкция");
    setIf("activity", "Деятельность"); setIf("protection", "Защита"); setIf("wear", "Износ");
    (res?.observations || []).slice(0, 5).forEach(o => applied.push({label: String(o), value: "наблюдение"}));
    S.photoApplied = applied;
    S.photoNote = applied.length
      ? `Готово. Уверенность: ${String(res?.confidence || "не указана")}. Проверьте подставленные значения.`
      : "По этим снимкам определить не удалось — заполните поля руками.";
  } catch (e) {
    S.photoNote = {not_granted:"Доступ к Claude не разрешён — заполните поля руками.",
      images_unavailable:"В этом окне фотографии недоступны.",
      image_rejected:"Файл не подошёл: нужен jpg или png поменьше.",
      rate_limited:"Слишком много запросов подряд, попробуйте через минуту.",
      invalid_json:"Ответ не удалось разобрать, попробуйте другие снимки."}[e?.code]
      || "Не получилось распознать, заполните поля руками.";
  }
  paintForm(); schedule(0);
}

/* ---------- события ---------- */
// агент поправил поле руками — значение больше не «из документа»
function dropDocMark(key){
  if (!S.fromDoc[key]) return;
  delete S.fromDoc[key];
  const el = document.getElementById("src-" + key);
  if (el) el.classList.remove("on");
}
function setPath(k, val){
  if (k.includes(".")){ const [a,b] = k.split("."); S[a][b] = val; }
  else S[k] = val;
}
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "pquery"){ S.query = t.value;
    // перерисовываем только список, поле поиска не трогаем — курсор остаётся на месте
    const box = document.getElementById("plist");
    const tmp = document.createElement("div"); tmp.innerHTML = cardProduct();
    box.innerHTML = tmp.querySelector("#plist").innerHTML;
    return;
  }
  if (t.id === "manualRate"){ S.manual.rate = Number(String(t.value).replace(",", ".")); schedule(); return; }
  if (t.id === "manualComment"){ S.manual.comment = t.value; return; }
  // поля оценки стоимости: запоминаем, но форму не перерисовываем — курсор остаётся в поле
  if (t.dataset.v){ S.val[t.dataset.v] = t.value; dropDocMark(t.dataset.v); return; }
  if (t.id === "osgQ"){ S.osg.q = t.value; scheduleActs(); return; }
  if (t.dataset.og){ S.osg[t.dataset.og] = t.value; scheduleOsgor(); return; }
  if (t.dataset.vh){
    S.veh[t.dataset.vh] = t.value;
    if (t.dataset.vh === "year") syncVehYear();
    scheduleVeh(); return;
  }
  const k = t.dataset.k;
  if (k && t.type !== "checkbox"){
    setPath(k, t.type === "number" ? Number(t.value) : t.value);
    schedule();   // перерисовываем только панель расчёта, поле ввода остаётся как есть
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.type === "checkbox" && t.dataset.og){ S.osg[t.dataset.og] = t.checked; scheduleOsgor(); return; }
  if (t.dataset.og){ S.osg[t.dataset.og] = t.value; scheduleOsgor(); return; }
  if (t.dataset.vh){ S.veh[t.dataset.vh] = t.value; scheduleVeh(0); return; }
  if (t.dataset.factor){ S.factors[t.dataset.factor] = t.value; schedule(0); return; }
  if (t.dataset.peril){ t.checked ? S.perils.add(t.dataset.peril) : S.perils.delete(t.dataset.peril); schedule(0); return; }
  if (t.dataset.doc){ t.checked ? S.docs.add(t.dataset.doc) : S.docs.delete(t.dataset.doc); schedule(0); return; }
  if (t.type === "checkbox" && t.dataset.k){ setPath(t.dataset.k, t.checked); schedule(0); return; }
  if (t.dataset.k === "payer" || t.dataset.k === "objectType"){ schedule(0); return; }
  if (t.dataset.rev){
    const id = Number(t.dataset.rev);
    if (t.checked){ if (S.rev.picked.length < 3 && !S.rev.picked.includes(id)) S.rev.picked.push(id); }
    else S.rev.picked = S.rev.picked.filter(x => x !== id);
    S.rev.note = "";
    paintReviewers();       // перерисовываем только этот блок, форму не трогаем
    return;
  }
  if (t.id === "revAgreement"){ applyAgreement(t.value); return; }
  if (t.id === "manualOn"){ S.manual.on = t.checked; paintForm(); schedule(0); return; }
  if (t.id === "manualReason"){ S.manual.reason = t.value; schedule(0); return; }
  if (t.dataset.v){ S.val[t.dataset.v] = t.value; dropDocMark(t.dataset.v); return; }
  if (t.id === "valKind"){
    S.val.kind = t.value; S.val.result = null; S.val.error = "";
    // сменили вид объекта — разбор прежнего документа к нему уже не относится
    if (S.doc.kind && S.doc.kind !== docKind()){
      S.doc = {kind:null, parsed:null, note:"", error:"", busy:false, file:null, recogBusy:false};
      S.fromDoc = {};
    }
    repaintValue(); return;
  }
  if (t.id === "docInput"){ uploadDoc(t.files[0]); return; }
  if (t.id === "photoInput"){
    const files = [...t.files];
    S.photos = files.slice(0, IMG_LIMITS?.maxCount ?? 4);   // для распознавания в опубликованном экране
    S.photoApplied = [];
    uploadPhotos(files);
  }
});
document.addEventListener("toggle", e => {
  if (e.target.id === "docsBox") S.docsOpen = e.target.open;
}, true);
document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.prod){ selectProduct(b.dataset.prod); return; }
  if (b.dataset.vprod){ selectProduct(b.dataset.vprod); return; }
  if (b.dataset.vgroup !== undefined){
    S.veh.group = b.dataset.vgroup;
    repaintVeh(); runVeh(); return;
  }
  if (b.id === "vehOn"){ S.veh.on = true; paintForm(); scheduleVeh(0); return; }
  if (b.dataset.act !== undefined){
    const g = S.osg;
    g.okved = b.dataset.act; g.activity_name = b.dataset.actname;
    g.kst = Number(b.dataset.kst); g.category = Number(b.dataset.cat);
    g.q = b.dataset.actname; g.hits = null; g.hitsNote = "";
    repaintOsgor(); runOsgor(); return;
  }
  if (b.id === "pickToggle"){ S.pick = !S.pick; paintForm();
    if (S.pick) document.getElementById("pquery")?.focus(); return; }
  if (b.id === "photoRun"){ analyzePhotos(); return; }
  if (b.dataset.delphoto){ deletePhoto(+b.dataset.delphoto); return; }
  if (b.id === "valRun"){ runValuation(); return; }
  if (b.id === "docRecog"){ recognizeDoc(); return; }
  if (b.id === "copyLetter"){
    const text = document.getElementById("letterText")?.textContent || "";
    const note = document.getElementById("copyNote");
    navigator.clipboard.writeText(text)
      .then(() => { if (note) note.textContent = "Текст письма скопирован."; })
      .catch(() => { if (note) note.textContent = "Скопировать не вышло — выделите текст и скопируйте вручную."; });
    return;
  }
  if (b.dataset.tip){
    const t = window.__tips[+b.dataset.tip]; if (!t?.patch) return;
    if (t.patch.factors) Object.assign(S.factors, t.patch.factors);
    if (t.patch.remove_peril) S.perils.delete(t.patch.remove_peril);
    if (t.patch.sum_insured) S.sum = t.patch.sum_insured;
    paintForm(); schedule(0); return;
  }
  if (b.id === "toUnderwriter"){
    b.textContent = "Отправлено андеррайтеру";
    setTimeout(() => { b.textContent = "Андеррайтеру"; }, 2200);
  }
});

/* Сохранение расчёта на сервере. Обработчик ставится в фазе перехвата раньше моста из app/main.py,
   потому что мост отправляет жёстко класс 8 и факторы класса 8, а здесь класс берётся у продукта. */
document.getElementById("toContract").addEventListener("click", async e => {
  e.stopImmediatePropagation();
  const b = e.currentTarget;
  const body = {...requestBody(), region: S.region, branch: "экран агента"};
  b.textContent = "Сохраняю…";
  try {
    const r = await fetch("/requests", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
    const j = await r.json();
    b.textContent = r.ok ? "Сохранено, запрос № " + j.request_id : "Не сохранилось: " + (j.detail || r.status);
    if (r.ok){
      S.requestId = j.request_id;     // теперь фотографии есть куда прикреплять
      loadPhotos();
      // состав согласующих отправляем отдельно: запрос уже сохранён, даже если состав не приняли
      const revNote = await sendReviewers(j.request_id);
      S.rev.note = revNote;
      paintReviewers();
      let a = document.getElementById("pdfLink");
      if (!a){ a = document.createElement("a"); a.id = "pdfLink"; a.target = "_blank";
        a.style.cssText = "display:block;text-align:center;padding:0 20px 14px;font-weight:600;color:var(--accent)";
        document.querySelector(".summary .actions").after(a); }
      a.href = "/requests/" + j.request_id + "/proposal.pdf";
      a.textContent = "Скачать предложение клиенту (PDF) →";
    }
  } catch (err){ b.textContent = "Сервер не ответил — расчёт не сохранён"; }
  setTimeout(() => { b.textContent = T("calc.for_contract", "В договор"); }, 4000);
}, true);

paintForm();
calc();
loadNorms();
loadReviewers();
// номер запроса можно передать в адресе: /ui?request=41 — тогда фотографии видны сразу
const rq = Number(new URLSearchParams(location.search).get("request"));
if (rq){ S.requestId = rq; repaintPhotos(); loadPhotos(); }
</script>
