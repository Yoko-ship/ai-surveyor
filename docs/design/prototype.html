<!--
  Источники дизайн-системы (взяты дословно, где не сказано иное)
  1. Revolut, Open Design — токены цвета, шкала текста, отступы, радиусы, тени, движение:
     https://open-design.ai/plugins/design-system-revolut/
  2. Wise, Open Design — Inter для текста, спокойная плотность форм:
     https://open-design.ai/plugins/design-system-wise/
  3. Material 3 — цель касания 48×48 dp, компактное окно 0–599 dp с полями 16 dp,
     нижняя навигация 80 dp (иконка 24, подпись 12), слои состояний, роли типографики:
     https://m3.material.io/foundations/designing/structure  ·  https://m3.material.io/styles/typography/type-scale-tokens
     https://m3.material.io/components/navigation-bar/specs  ·  https://m3.material.io/foundations/interaction/states/state-layers
  4. Apple Human Interface Guidelines — минимум касания 44×44 pt, поля 16 pt, safe-area:
     https://developer.apple.com/design/human-interface-guidelines/layout
     https://developer.apple.com/design/human-interface-guidelines/typography
  5. Шрифты Google Fonts: Inter (https://fonts.google.com/specimen/Inter), JetBrains Mono (https://fonts.google.com/specimen/JetBrains+Mono)
  Заменено под INSON: акцент Revolut → синий INSON #1D2C8F (accent-on #fff); success → зелёный INSON #22A85A;
  цифры — JetBrains Mono вместо Inter; поле телефона 18 px Revolut → 16 px (M3 и HIG, сетка 4).
  Производные (выведены нами, не из источника): все токены тёмной темы, мягкие подложки *-soft,
  текстовые варианты *-fg для статусов (контраст AA на белом), --lime для шкалы балла, цвета камеры.
-->
<title>Сюрвейер INSON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Токены. Раскладка: компактное окно M3 (0–599 dp), поля 16, сетка 4; один акцент — синий INSON. */
:root{
  /* цвет — Revolut Open Design, дословно */
  --bg:#f7f8fb; --surface:#ffffff; --surface-warm:#eef4ff;
  --fg:#111827; --fg-2:#334155; --muted:#64748b;
  --border:#dbe3ef; --border-soft:#edf2f7;
  --warn:#f59e0b; --danger:#ef4444;
  /* заменено под INSON */
  --accent:#1D2C8F; --accent-on:#ffffff; --success:#22A85A;
  /* производные (наши): мягкие подложки, текст статусов с контрастом AA, шкала балла */
  --accent-soft:#e6e9f7; --success-on:#052e16; --success-fg:#157a3f; --success-soft:#e3f5ea;
  --warn-fg:#b45309; --warn-soft:#fef3d7; --danger-fg:#c62828; --danger-soft:#fde8e8; --lime:#84b53a;
  --scrim:rgba(17,24,39,.45); --stage:#e9edf5; --frame:#0b1020;
  --cam:#151c38; --cam-2:#26345f; --cam-ink:#e9eeff; --cam-shutter:#ffffff; --ph-1:#c9d1e6; --ph-2:#8e9ac0;
  --logo-ins:#1D2C8F; --logo-on:#22A85A;
  /* шрифты — Google Fonts */
  --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  /* шкала текста — Revolut */
  --text-xs:12px; --text-sm:14px; --text-base:16px; --text-lg:18px; --text-xl:24px; --text-2xl:36px;
  --leading-body:1.5; --leading-tight:1.02; --tracking-display:-0.03em;
  /* роли типографики — Material 3 (размер/интерлиньяж/вес) */
  --t-display-s:700 36px/44px var(--font-sans);
  --t-headline-s:700 24px/32px var(--font-sans);
  --t-title-l:600 22px/28px var(--font-sans);
  --t-title-m:500 16px/24px var(--font-sans);
  --t-body-l:400 16px/24px var(--font-sans);
  --t-body-m:400 14px/20px var(--font-sans);
  --t-label-l:500 14px/20px var(--font-sans);
  --t-label-m:500 12px/16px var(--font-sans);
  /* отступы — Revolut, только эти значения */
  --space-4:4px; --space-8:8px; --space-12:12px; --space-16:16px; --space-20:20px; --space-24:24px; --space-32:32px; --space-48:48px;
  /* радиусы — Revolut */
  --radius-sm:12px; --radius-md:20px; --radius-lg:30px; --radius-pill:999px;
  /* тени — Revolut */
  --elev-ring:0 0 0 1px var(--border);
  --elev-raised:0 24px 64px rgba(17,24,39,.12);
  --focus-ring:0 0 0 4px rgba(29,44,143,.22);
  /* движение — Revolut */
  --motion-fast:150ms; --motion-base:240ms; --ease:cubic-bezier(.22,1,.36,1);
  /* раскладка — M3 и Apple HIG */
  --gutter:16px; --touch:48px; --nav-h:80px; --icon:24px;
  /* слои состояний — M3 */
  --sl-hover:.08; --sl-focus:.10; --sl-press:.10;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  /* производные: тёмная тема выведена нами с тем же контрастом текста */
  --bg:#0b1020; --surface:#141b2e; --surface-warm:#1b2542;
  --fg:#f1f5f9; --fg-2:#cbd5e1; --muted:#94a3b8; --border:#2a3550; --border-soft:#1c2539;
  --warn:#fbbf24; --danger:#f87171; --accent:#93a3ff; --accent-on:#0b1020; --success:#34c474;
  --accent-soft:#212c55; --success-on:#052e16; --success-fg:#5bd08e; --success-soft:#12301f;
  --warn-fg:#fbbf24; --warn-soft:#3a2b0c; --danger-fg:#f87171; --danger-soft:#3b1719; --lime:#a3d65c;
  --scrim:rgba(0,0,0,.6); --stage:#05070f; --frame:#000000; --ph-1:#3b4c86; --ph-2:#1e2a55;
  --logo-ins:#93a3ff; --logo-on:#34c474;
  --elev-raised:0 24px 64px rgba(0,0,0,.5); --focus-ring:0 0 0 4px rgba(147,163,255,.28);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#141b2e; --surface-warm:#1b2542;
  --fg:#f1f5f9; --fg-2:#cbd5e1; --muted:#94a3b8; --border:#2a3550; --border-soft:#1c2539;
  --warn:#fbbf24; --danger:#f87171; --accent:#93a3ff; --accent-on:#0b1020; --success:#34c474;
  --accent-soft:#212c55; --success-on:#052e16; --success-fg:#5bd08e; --success-soft:#12301f;
  --warn-fg:#fbbf24; --warn-soft:#3a2b0c; --danger-fg:#f87171; --danger-soft:#3b1719; --lime:#a3d65c;
  --scrim:rgba(0,0,0,.6); --stage:#05070f; --frame:#000000; --ph-1:#3b4c86; --ph-2:#1e2a55;
  --logo-ins:#93a3ff; --logo-on:#34c474;
  --elev-raised:0 24px 64px rgba(0,0,0,.5); --focus-ring:0 0 0 4px rgba(147,163,255,.28);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--stage);color:var(--fg);font:var(--t-body-m);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:-.01em}
svg{display:block}

/* слой состояния M3: hover 8 %, focus 10 %, pressed 10 % от цвета содержимого */
.btn,.chip,.ibtn,.nav button,.case,.type,.sec,.opt,.seg button,.tabs button,.panel .st-list button,.bignew,.fact .ed,.srcbar button,.switch,.ctx button,.th.add,.prog button{position:relative;-webkit-tap-highlight-color:transparent}
.btn::after,.chip::after,.ibtn::after,.nav button::after,.case::after,.type::after,.sec::after,.opt::after,.seg button::after,.tabs button::after,.panel .st-list button::after,.bignew::after,.fact .ed::after,.srcbar button::after,.switch::after,.ctx button::after,.th.add::after{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0;pointer-events:none;transition:opacity var(--motion-fast) var(--ease)}
.btn:hover::after,.chip:hover::after,.ibtn:hover::after,.nav button:hover::after,.case:hover::after,.type:hover::after,.sec:hover::after,.opt:hover::after,.seg button:hover::after,.tabs button:hover::after,.panel .st-list button:hover::after,.bignew:hover::after,.fact .ed:hover::after,.srcbar button:hover::after,.switch:hover::after,.ctx button:hover::after,.th.add:hover::after{opacity:var(--sl-hover)}
.btn:focus-visible::after,.chip:focus-visible::after,.case:focus-visible::after,.sec:focus-visible::after,.opt:focus-visible::after{opacity:var(--sl-focus)}
.btn:active::after,.chip:active::after,.ibtn:active::after,.nav button:active::after,.case:active::after,.type:active::after,.sec:active::after,.opt:active::after,.seg button:active::after,.tabs button:active::after,.bignew:active::after,.switch:active::after,.th.add:active::after{opacity:var(--sl-press)}
.btn[disabled]::after{opacity:0!important}

/* ---------- студия: панель экранов + телефон ---------- */
.studio{display:grid;grid-template-columns:304px minmax(0,1fr);min-height:100vh}
.panel{background:var(--surface);box-shadow:1px 0 0 var(--border);padding:var(--space-24) var(--space-16);overflow-y:auto;max-height:100vh;position:sticky;top:0}
.panel .brand{font:var(--t-title-l);letter-spacing:var(--tracking-display)}
.panel .lead{font:var(--t-body-m);color:var(--muted);margin:var(--space-8) 0 var(--space-16);max-width:34ch}
.panel h4{margin:var(--space-16) 0 var(--space-4);font:var(--t-label-m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel .st-list{display:grid;gap:0}
.panel .st-list button{display:flex;align-items:center;width:100%;text-align:left;min-height:40px;padding:var(--space-8) var(--space-12);border-radius:var(--radius-sm);font:var(--t-body-m);color:var(--fg)}
.panel .st-list button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.panel .foot{margin-top:var(--space-16);font:var(--t-label-m);font-weight:400;color:var(--muted);border-top:1px solid var(--border);padding-top:var(--space-12);display:grid;gap:var(--space-8)}
.stage{display:grid;place-items:center;padding:var(--space-24) var(--space-16)}
.phone{width:390px;max-width:100%;height:min(844px,calc(100vh - 48px));min-height:620px;background:var(--frame);border-radius:48px;padding:var(--space-12);box-shadow:var(--elev-raised)}
.screen{height:100%;border-radius:36px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;position:relative;isolation:isolate}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:var(--space-12) var(--space-24) var(--space-4);font:var(--t-label-m);font-weight:600;color:var(--muted);flex:none}
.sbar .isl{width:96px;height:28px;border-radius:var(--radius-pill);background:var(--frame)}
@media (max-width:760px){
  html,body{height:100%}
  .studio{display:block;height:100%;min-height:0}
  .panel{display:none}
  .stage{padding:0;height:100%;display:block}
  .phone{width:100%;height:100%;min-height:0;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
  .screen{border-radius:0}
  .sbar{display:none}
}

/* ---------- каркас приложения ---------- */
.hd{flex:none;display:flex;align-items:center;gap:var(--space-8);padding:var(--space-8) var(--space-8) var(--space-8) var(--gutter);min-height:64px}
.hd>.ibtn:first-child{margin-left:calc(-1 * var(--space-12))}
.hd .ttl{flex:1;min-width:0}
.hd .ttl b{display:block;font:var(--t-title-l);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .ttl>span{display:block;font:var(--t-label-m);font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{font-weight:700;letter-spacing:-.02em;font-size:var(--text-sm)}
.logo b{color:var(--logo-ins)}.logo i{color:var(--logo-on);font-style:normal}
.ibtn{width:var(--touch);height:var(--touch);border-radius:var(--radius-pill);display:grid;place-items:center;color:var(--fg);flex:none}
.ibtn svg{width:var(--icon);height:var(--icon);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ava{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-on);display:grid;place-items:center;font:var(--t-label-l);font-weight:700;flex:none;position:relative}
.hd .ava{margin-right:var(--space-8)}
button.ava::before{content:"";position:absolute;inset:-4px}
.vw{flex:1;overflow-y:auto;overflow-x:hidden;padding:var(--space-4) var(--gutter) var(--space-24);overscroll-behavior:contain;scrollbar-width:thin}
.cta{flex:none;padding:var(--space-12) var(--gutter);background:var(--bg);box-shadow:0 -1px 0 var(--border);display:grid;gap:var(--space-8)}
.nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);box-shadow:0 -1px 0 var(--border);height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding:0 var(--space-8) env(safe-area-inset-bottom,0px)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:var(--space-4);padding:var(--space-12) 0 var(--space-16);color:var(--muted);font:var(--t-label-m);min-width:0}
.nav button svg{width:var(--icon);height:var(--icon);box-sizing:content-box;padding:var(--space-4) var(--space-20);border-radius:var(--radius-pill);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:background var(--motion-fast) var(--ease)}
.nav button::after{inset:var(--space-12) auto auto 50%;width:64px;height:32px;transform:translateX(-50%);border-radius:var(--radius-pill)}
.nav button.on{color:var(--fg);font-weight:600}
.nav button.on svg{background:var(--accent-soft);color:var(--accent)}
.enter{animation:enter var(--motion-base) var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- общие элементы ---------- */
.stack,.chat,.dlg,.ans,.cases,.types,.bars,.say,.todo,.sheet .sb,.rlist{grid-template-columns:minmax(0,1fr)}
.stack>*,.chat>*,.dlg>*,.ans>*{min-width:0}
.btn{display:flex;align-items:center;justify-content:center;gap:var(--space-8);border-radius:var(--radius-pill);padding:var(--space-12) var(--space-20);font:var(--t-label-l);font-weight:600;font-size:var(--text-base);border:0;text-align:center;min-height:var(--touch)}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn-p{background:var(--accent);color:var(--accent-on)}
.btn-s{background:var(--surface);color:var(--fg);box-shadow:var(--elev-ring)}
.btn-g{background:var(--success);color:var(--success-on)}
.btn-d{background:var(--surface);color:var(--danger-fg);box-shadow:var(--elev-ring)}
.btn-sm{padding:var(--space-8) var(--space-16);font-size:var(--text-sm)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible{box-shadow:var(--focus-ring)}
.row{display:flex;gap:var(--space-8)}
.row>*{flex:1;min-width:0}
.card{background:var(--surface);box-shadow:var(--elev-ring);border-radius:var(--radius-md);padding:var(--space-16)}
.cap{font:var(--t-label-m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:grid;gap:var(--space-12)}
.muted{color:var(--muted)}
.small{font:var(--t-body-m)}
.chips{display:flex;flex-wrap:wrap;gap:var(--space-8)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-block:var(--space-8);margin-block:calc(-1 * var(--space-8))}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;font:var(--t-label-l);min-height:32px;padding:var(--space-4) var(--space-12);border-radius:var(--radius-pill);background:var(--surface);box-shadow:var(--elev-ring);color:var(--fg);white-space:nowrap;display:inline-flex;align-items:center}
.chip::before{content:"";position:absolute;inset:-8px 0}
.chip.on{background:var(--accent);box-shadow:none;color:var(--accent-on)}
.chip .c{font-family:var(--font-mono);font-size:var(--text-xs);opacity:.75;margin-left:var(--space-4)}
.tg{display:inline-block;font:var(--t-label-m);padding:0 var(--space-8);border-radius:var(--radius-pill);white-space:nowrap;vertical-align:middle}
.tg.doc{background:var(--success-soft);color:var(--success-fg)}
.tg.me{background:var(--warn-soft);color:var(--warn-fg)}
.tg.ai{background:var(--accent-soft);color:var(--accent)}
.tg.exp{background:transparent;color:var(--warn-fg);box-shadow:inset 0 0 0 1px var(--warn)}
.st{display:inline-flex;align-items:center;gap:var(--space-8);font:var(--t-label-m);font-weight:600;padding:var(--space-4) var(--space-8);border-radius:var(--radius-pill);white-space:nowrap}
.st:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st.draft{background:var(--border-soft);color:var(--fg-2)}
.st.ready{background:var(--accent-soft);color:var(--accent)}
.st.wait{background:var(--warn-soft);color:var(--warn-fg)}
.st.ok{background:var(--success-soft);color:var(--success-fg)}
.field{display:grid;gap:var(--space-4)}
.field label,.lbl{font:var(--t-label-m);color:var(--fg-2)}
.inp{width:100%;background:var(--surface);border:0;box-shadow:var(--elev-ring);border-radius:var(--radius-sm);padding:var(--space-12) var(--space-16);font:var(--t-body-l);min-height:var(--touch);color:var(--fg);transition:box-shadow var(--motion-fast) var(--ease)}
.inp:focus{outline:none;box-shadow:0 0 0 1px var(--accent),var(--focus-ring)}
.inp.num{font-family:var(--font-mono)}
.inpwrap{position:relative}
.inpwrap .u{position:absolute;right:var(--space-12);top:50%;transform:translateY(-50%);font:var(--t-label-m);color:var(--muted);pointer-events:none}
.inpwrap .inp{padding-right:var(--space-48)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:var(--space-32)}
.seg{display:flex;background:var(--border-soft);border-radius:var(--radius-sm);padding:var(--space-4);gap:var(--space-4)}
.seg button{flex:1;min-height:40px;padding:var(--space-8) var(--space-4);border-radius:8px;font:var(--t-label-l);color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:var(--elev-ring)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-8) var(--space-12);font:var(--t-body-m);align-items:baseline}
.kv dt{color:var(--muted);margin:0}
.kv dd{margin:0;text-align:right;font-weight:600}
.note{font:var(--t-label-m);font-weight:400;color:var(--muted)}
.flagline{display:flex;flex-wrap:wrap;gap:var(--space-8)}
.srcbar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-8);flex-wrap:wrap;font:var(--t-label-m);font-weight:400;color:var(--muted);border-top:1px solid var(--border-soft);padding-top:var(--space-4);margin-top:var(--space-12)}
.srcbar button{color:var(--accent);font:var(--t-label-m);font-weight:600;min-height:var(--touch);padding:0 var(--space-8);margin-right:calc(-1 * var(--space-8));border-radius:var(--radius-sm)}
.alert{display:flex;gap:var(--space-12);align-items:flex-start;background:var(--warn-soft);border-radius:var(--radius-sm);padding:var(--space-12);font:var(--t-body-m)}
.alert.bad{background:var(--danger-soft)}
.alert .ic{width:24px;height:24px;border-radius:8px;background:var(--warn);color:var(--frame);display:grid;place-items:center;font-weight:700;flex:none;font-family:var(--font-mono);font-size:var(--text-sm)}
.alert.bad .ic{background:var(--danger);color:var(--surface)}
.alert b{display:block;margin-bottom:var(--space-4);font-weight:600}
.empty{display:grid;justify-items:center;text-align:center;gap:var(--space-8);padding:var(--space-48) var(--space-12)}
.empty .eic{width:56px;height:56px;border-radius:var(--radius-md);background:var(--border-soft);display:grid;place-items:center;color:var(--muted)}
.empty .eic svg{width:var(--icon);height:var(--icon);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty b{font:var(--t-title-m);font-weight:600}
.empty p{font:var(--t-body-m);color:var(--muted);max-width:30ch}
.sk{background:linear-gradient(90deg,var(--border-soft) 0,var(--border) 40%,var(--border-soft) 80%);background-size:300% 100%;border-radius:8px;animation:sh 1.2s linear infinite}
@keyframes sh{from{background-position:100% 0}to{background-position:-50% 0}}
.skcard{background:var(--surface);box-shadow:var(--elev-ring);border-radius:var(--radius-md);padding:var(--space-16);display:grid;gap:var(--space-12)}

/* ---------- Дела ---------- */
.search{position:relative}
.search svg{position:absolute;left:var(--space-16);top:50%;transform:translateY(-50%);width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.search .inp{padding-left:var(--space-48)}
.bignew{display:flex;align-items:center;gap:var(--space-16);background:var(--accent);color:var(--accent-on);border-radius:var(--radius-md);padding:var(--space-16);text-align:left;width:100%}
.bignew .pl{width:48px;height:48px;border-radius:var(--radius-pill);background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.bignew .pl svg{width:var(--icon);height:var(--icon);fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.bignew b{display:block;font:var(--t-title-m);font-weight:600}
.bignew span{display:block;font:var(--t-body-m);opacity:.82}
.cases{display:grid;gap:var(--space-8)}
.case{display:grid;gap:var(--space-8);background:var(--surface);box-shadow:var(--elev-ring);border-radius:var(--radius-md);padding:var(--space-16);text-align:left;width:100%}
.case .top{display:flex;justify-content:space-between;align-items:center;gap:var(--space-8);font:var(--t-label-m);font-weight:400;color:var(--muted)}
.case .top .code{font-family:var(--font-mono);font-weight:700;color:var(--fg);background:var(--border-soft);border-radius:var(--space-4);padding:0 var(--space-4);margin-right:var(--space-8)}
.case .obj{font:var(--t-title-m);font-weight:600}
.case .bot{display:flex;justify-content:space-between;align-items:center;gap:var(--space-8)}
.case .prem{font-size:var(--text-base)}
.case .prem small{font-family:var(--font-sans);font-size:var(--text-xs);color:var(--muted);margin-left:var(--space-4)}

/* ---------- Новый ---------- */
.types{display:grid;gap:var(--space-12)}
.type{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-16);align-items:center;background:var(--surface);box-shadow:var(--elev-ring);border-radius:var(--radius-md);padding:var(--space-16);text-align:left;width:100%}
.type .ti{width:48px;height:48px;border-radius:var(--radius-sm);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.type .ti svg{width:var(--icon);height:var(--icon);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.type b{display:block;font:var(--t-title-m);font-weight:600}
.type span{display:block;font:var(--t-body-m);color:var(--muted)}
.type em{font-style:normal;font-size:var(--text-xs);color:var(--muted);font-family:var(--font-mono)}
.type .chev{color:var(--muted);font-size:var(--text-xl)}

/* ---------- мастер ---------- */
.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-8);padding:0 var(--gutter) var(--space-8);flex:none}
.prog button{display:grid;gap:var(--space-8);align-content:center;min-height:var(--touch);text-align:left;font:var(--t-label-m);font-weight:600;color:var(--muted)}
.prog button i{height:4px;border-radius:var(--radius-pill);background:var(--border);display:block}
.prog button.done{color:var(--success-fg)}.prog button.done i{background:var(--success)}
.prog button.on{color:var(--accent)}.prog button.on i{background:var(--accent)}
.prog button[disabled]{cursor:default}
.cam{height:248px;border-radius:var(--radius-md);background:radial-gradient(120% 90% at 30% 10%,var(--cam-2),var(--cam) 70%);position:relative;overflow:hidden;color:var(--cam-ink)}
.cam .frame{position:absolute;inset:var(--space-32) var(--space-32) 80px;border:1.5px solid rgba(255,255,255,.3);border-radius:var(--radius-sm)}
.cam .frame:before,.cam .frame:after{content:"";position:absolute;width:24px;height:24px;border:3px solid var(--logo-on)}
.cam .frame:before{left:-2px;top:-2px;border-right:0;border-bottom:0;border-radius:var(--radius-sm) 0 0 0}
.cam .frame:after{right:-2px;bottom:-2px;border-left:0;border-top:0;border-radius:0 0 var(--radius-sm) 0}
.cam .crane{position:absolute;left:50%;top:56px;transform:translateX(-50%);width:208px;opacity:.75}
.cam .crane *{fill:none;stroke:var(--cam-ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.cam .ai{position:absolute;left:var(--space-12);top:var(--space-12);font:var(--t-label-m);font-weight:600;padding:var(--space-4) var(--space-8);border-radius:var(--radius-pill);background:rgba(0,0,0,.35);color:var(--cam-ink)}
.cam .ai:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--logo-on);margin-right:var(--space-8)}
.cam .hint{position:absolute;left:var(--space-12);right:88px;bottom:var(--space-16);font:var(--t-label-l);font-weight:600}
.cam .hint span{display:block;font:var(--t-label-m);font-weight:400;opacity:.8}
.cam .shot{position:absolute;right:var(--space-16);bottom:var(--space-12);width:60px;height:60px;border-radius:50%;background:var(--cam-shutter);border:5px solid rgba(255,255,255,.35);background-clip:padding-box;transition:transform var(--motion-fast) var(--ease)}
.cam .shot:active{transform:scale(.94)}
.strip{display:flex;gap:var(--space-8);overflow-x:auto;padding:var(--space-8) var(--space-4) var(--space-4);scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.th{flex:none;width:80px;height:80px;border-radius:var(--radius-sm);background:linear-gradient(140deg,var(--ph-1),var(--ph-2));position:relative;display:flex;align-items:flex-end;padding:var(--space-8);font:var(--t-label-m);font-weight:600;color:var(--cam-ink)}
.th.doc{background:var(--surface);box-shadow:var(--elev-ring);color:var(--muted);align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:var(--space-4)}
.th.doc svg{width:20px;height:20px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.th.add{border:1.5px dashed var(--border);background:transparent;color:var(--accent);justify-content:center;align-items:center}
.th .x{position:absolute;right:-4px;top:-4px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:var(--elev-ring);color:var(--muted);display:grid;place-items:center;font-size:var(--text-sm);line-height:1}
.th .x::before{content:"";position:absolute;inset:-12px}
.todo{display:grid;gap:var(--space-8)}
.todo div{display:flex;gap:var(--space-12);align-items:flex-start;font:var(--t-body-m)}
.todo .b{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;flex:none;font:var(--t-label-m);font-weight:700}
.todo .ok{background:var(--success-soft);color:var(--success-fg)}
.todo .no{background:transparent;border:1.5px dashed var(--border);color:var(--muted)}
.todo span{color:var(--muted)}

/* диалог */
.who{font:var(--t-label-m);color:var(--muted);margin:0 0 var(--space-4) var(--space-4)}
.msg{max-width:92%;background:var(--surface);box-shadow:var(--elev-ring);border-radius:var(--radius-md) var(--radius-md) var(--radius-md) var(--space-4);padding:var(--space-12) var(--space-16);font:var(--t-body-m)}
.msg.me{margin-left:auto;max-width:80%;background:var(--accent);box-shadow:none;color:var(--accent-on);border-radius:var(--radius-md) var(--radius-md) var(--space-4) var(--radius-md)}
.dlg{display:grid;gap:var(--space-12)}
.fact{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 var(--space-12);padding:var(--space-8) 0;border-top:1px solid var(--border-soft);align-items:center}
.fact:first-child{border-top:0;padding-top:var(--space-4)}
.fact .v{font:var(--t-label-l);font-weight:600;min-width:0;overflow-wrap:anywhere}
.fact .l{grid-column:1/-1;font:var(--t-label-m);font-weight:400;color:var(--muted)}
.fact .w{grid-column:1/-1;font:var(--t-label-m);color:var(--warn-fg);font-weight:600}
.fact .ed{color:var(--accent);font:var(--t-label-l);font-weight:600;min-height:var(--touch);padding:0 var(--space-8);margin-right:calc(-1 * var(--space-8));border-radius:var(--radius-sm)}
.fact .edit{grid-column:1/-1;display:grid;gap:var(--space-8);margin-top:var(--space-4)}
.acts{display:flex;gap:var(--space-8);margin-top:var(--space-12)}
.acts .btn{flex:1}
.ratio{height:8px;border-radius:var(--radius-pill);background:var(--border-soft);position:relative;margin:var(--space-12) 0 var(--space-4)}
.ratio .zone{position:absolute;top:0;bottom:0;background:var(--success-soft);border-left:2px solid var(--success);border-right:2px solid var(--success)}
.ratio .mk{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--fg);transform:translateX(-50%)}
.typing{display:inline-flex;gap:var(--space-4);padding:var(--space-16)}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}

/* акт */
.gauge{position:relative;max-width:300px;margin:0 auto}
.gauge svg{width:100%;height:auto}
.gauge .c{position:absolute;left:0;right:0;bottom:var(--space-4);text-align:center}
.gauge .c b{display:block;font:var(--t-display-s);font-family:var(--font-mono);letter-spacing:var(--tracking-display);font-variant-numeric:tabular-nums}
.gauge .c span{display:block;font:var(--t-label-m);font-weight:400;color:var(--muted)}
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-8)}
.kpi div{background:var(--surface);box-shadow:var(--elev-ring);border-radius:var(--radius-sm);padding:var(--space-12) var(--space-8);min-width:0}
.kpi b{display:block;font:var(--t-title-m);font-family:var(--font-mono);font-weight:700;font-size:var(--text-sm);white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi span{display:block;font:var(--t-label-m);font-weight:400;color:var(--muted);margin-top:var(--space-4)}
.kpi .rec{color:var(--accent)}.kpi .low{color:var(--danger-fg)}
.btn3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-8)}
.btn3 .btn{font-size:var(--text-sm);padding:var(--space-8) var(--space-4)}
.fork{position:relative;height:88px;margin:var(--space-8) var(--space-12) 0}
.fork .track{position:absolute;left:0;right:0;top:40px;height:8px;border-radius:var(--radius-pill);background:var(--border-soft)}
.fork .band{position:absolute;top:40px;height:8px;border-radius:var(--radius-pill);background:var(--accent-soft)}
.fork .m{position:absolute;transform:translateX(-50%);text-align:center;width:76px}
.fork .m.up{top:0}.fork .m.dn{top:36px}
.fork .m b{display:block;font-family:var(--font-mono);font-size:var(--text-xs);font-weight:700;font-variant-numeric:tabular-nums}
.fork .m span{display:block;font-size:11px;color:var(--muted);line-height:1.15}
.fork .m i{display:block;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--muted);margin:var(--space-4) auto}
.fork .m.dn i{margin:0 auto var(--space-4)}
.fork .m.rec b{color:var(--accent)}.fork .m.rec i{border-color:var(--accent);background:var(--accent)}
.fork .m.low b{color:var(--danger-fg)}.fork .m.low i{border-color:var(--danger)}
.tabs{display:flex;gap:var(--space-4);background:var(--border-soft);border-radius:var(--radius-sm);padding:var(--space-4)}
.tabs button{flex:1;min-height:40px;padding:var(--space-8) var(--space-4);border-radius:8px;font:var(--t-label-l);color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:var(--elev-ring)}
.secs{background:var(--surface);box-shadow:var(--elev-ring);border-radius:var(--radius-md);padding:var(--space-4) var(--space-16)}
.sec{display:flex;align-items:center;gap:var(--space-12);padding:var(--space-12) 0;min-height:64px;border-top:1px solid var(--border-soft);width:100%;text-align:left}
.sec::after{inset:0 calc(-1 * var(--space-16))}
.sec:first-child{border-top:0}
.sec .n{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--accent-soft);display:grid;place-items:center;font-family:var(--font-mono);font-weight:700;font-size:var(--text-xs);color:var(--accent);flex:none}
.sec .t{flex:1;min-width:0}
.sec .t b{display:block;font:var(--t-label-l);font-weight:600}
.sec .t span{display:block;font:var(--t-label-m);font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec .cnt{font:var(--t-label-m);font-weight:700;padding:0 var(--space-8);border-radius:var(--radius-pill);background:var(--warn-soft);color:var(--warn-fg);font-family:var(--font-mono)}
.sec .chev{color:var(--muted);font-size:var(--text-xl)}
.bars{display:grid;gap:var(--space-12)}
.bar .bl{display:flex;justify-content:space-between;gap:var(--space-8);font:var(--t-body-m);margin-bottom:var(--space-4)}
.bar .bl b{font-weight:600}
.bar .tr{height:12px;border-radius:var(--radius-pill);background:var(--border-soft);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:var(--radius-pill);background:var(--accent)}
.bar .tr i.hi{background:var(--muted)}
.axis{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:var(--space-8)}
.axis.abs{position:relative;height:16px;display:block}
.axis.abs span{position:absolute;top:0}
.rlist{display:grid}
.rlist div{display:flex;justify-content:space-between;gap:var(--space-12);padding:var(--space-8) 0;border-top:1px solid var(--border-soft);font:var(--t-body-m)}
.rlist div:first-child{border-top:0}
.lvl{font:var(--t-label-m);font-weight:600;padding:0 var(--space-8);border-radius:var(--radius-pill);white-space:nowrap;align-self:center}
.lvl.h{background:var(--danger-soft);color:var(--danger-fg)}.lvl.m{background:var(--warn-soft);color:var(--warn-fg)}.lvl.l{background:var(--success-soft);color:var(--success-fg)}
.tbl{width:100%;border-collapse:collapse;font:var(--t-body-m)}
.tbl th,.tbl td{padding:var(--space-8) var(--space-4);border-bottom:1px solid var(--border-soft);text-align:left;vertical-align:top}
.tbl th{font:var(--t-label-m);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tbl td.r,.tbl th.r{text-align:right}
.tblwrap{overflow-x:auto}
.say{display:grid;gap:var(--space-12)}
.say div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:var(--space-12);font:var(--t-body-m);padding-top:var(--space-12);border-top:1px solid var(--border-soft)}
.say div:first-child{border-top:0;padding-top:0}
.say dt{font-weight:600;margin:0}
.say dd{margin:0;color:var(--fg)}

/* полноэкранный лист и шторка */
.full{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20}
.full.in{animation:slide var(--motion-base) var(--ease)}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end;animation:fade var(--motion-fast) var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);width:100%;max-height:86%;border-radius:var(--radius-lg) var(--radius-lg) 0 0;display:flex;flex-direction:column;box-shadow:var(--elev-raised);animation:up var(--motion-base) var(--ease)}
@keyframes up{from{transform:translateY(48px)}to{transform:none}}
.sheet .grab{width:32px;height:4px;border-radius:var(--radius-pill);background:var(--border);margin:var(--space-16) auto var(--space-4)}
.sheet .sh{display:flex;align-items:center;gap:var(--space-8);padding:var(--space-4) var(--space-8) var(--space-8) var(--gutter)}
.sheet .sh b{flex:1;font:var(--t-title-l)}
.sheet .sb{overflow-y:auto;padding:var(--space-4) var(--gutter) var(--space-12);display:grid;gap:var(--space-12)}
.sheet .sf{padding:var(--space-12) var(--gutter) calc(var(--space-16) + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border-soft);display:grid;gap:var(--space-8)}
.opt{display:flex;align-items:center;gap:var(--space-12);padding:var(--space-12);min-height:64px;box-shadow:var(--elev-ring);border-radius:var(--radius-sm);text-align:left;width:100%}
.opt .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex:none}
.opt.on{box-shadow:0 0 0 2px var(--accent);background:var(--accent-soft)}
.opt.on .rd{border:6px solid var(--accent)}
.opt div{flex:1;min-width:0}
.opt b{display:block;font:var(--t-label-l);font-weight:600}
.opt span{display:block;font:var(--t-label-m);font-weight:400;color:var(--muted)}
.frow{display:grid;gap:var(--space-8)}
.frow .fl{display:flex;justify-content:space-between;font:var(--t-label-l)}
.toast{position:absolute;left:var(--gutter);right:var(--gutter);bottom:96px;background:var(--fg);color:var(--bg);border-radius:var(--radius-sm);padding:var(--space-12) var(--space-16);font:var(--t-body-m);z-index:40;box-shadow:var(--elev-raised);animation:up var(--motion-base) var(--ease)}

/* специалист */
.chat{display:grid;gap:var(--space-12)}
.day{text-align:center;font:var(--t-label-m);color:var(--muted)}
.ans{display:grid;gap:var(--space-12)}
.blk{box-shadow:var(--elev-ring);border-radius:var(--radius-sm);padding:var(--space-12);background:var(--bg)}
.blk h5{margin:0 0 var(--space-8);font:var(--t-label-m);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.blk.out{background:var(--accent-soft);box-shadow:none}
.blk.out h5{color:var(--accent)}
.drow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 var(--space-8);padding:var(--space-8) 0;border-top:1px solid var(--border-soft);font:var(--t-body-m)}
.drow:first-of-type{border-top:0}
.drow .dv{font-weight:600;text-align:right}
.drow .ds{grid-column:1/-1}
.ctx{display:flex;align-items:center;gap:var(--space-8);background:var(--surface);box-shadow:var(--elev-ring);border-radius:var(--radius-sm);padding:0 0 0 var(--space-12);font:var(--t-label-m);font-weight:400;min-height:var(--touch)}
.ctx b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ctx button{color:var(--muted);font-size:var(--text-base);width:var(--touch);min-height:var(--touch);border-radius:var(--radius-sm)}
.send{display:flex;gap:var(--space-8)}
.send .inp{flex:1;min-width:0}
.send .btn{width:var(--touch);padding:0}

/* профиль */
.pcard{display:flex;gap:var(--space-16);align-items:center}
.pcard .ava{width:56px;height:56px;font:var(--t-title-m);font-weight:700}
.pcard b{display:block;font:var(--t-title-m);font-weight:600}
.pcard span{display:block;font:var(--t-body-m);color:var(--muted)}
.set{display:grid;gap:var(--space-16)}
.set .sr{display:grid;gap:var(--space-8)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:var(--space-12);font:var(--t-body-m);width:100%;min-height:var(--touch);text-align:left;border-radius:var(--radius-sm)}
.switch i{width:52px;height:32px;border-radius:var(--radius-pill);background:var(--border);position:relative;flex:none;transition:background var(--motion-fast) var(--ease)}
.switch i:after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:transform var(--motion-base) var(--ease)}
.switch[aria-checked="true"] i{background:var(--success)}
.switch[aria-checked="true"] i:after{transform:translateX(20px)}

@media (prefers-reduced-motion: reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}

/* ===== 04.10: ссылка-действие, лестница ставки, опасности, мероприятия с отметками ===== */
.lnk{display:inline-flex;align-items:center;gap:var(--space-4);min-height:var(--touch);padding:0 var(--space-8);margin:0 calc(-1 * var(--space-8));border-radius:var(--radius-sm);font:var(--t-label-l);font-weight:600;color:var(--accent);text-align:left;position:relative}
.lnk::after{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0;pointer-events:none;transition:opacity var(--motion-fast) var(--ease)}

function gaugeSVG(score){

  var f=score/500;
  var bands=[[0,.25,"--danger","D"],[.25,.5,"--warn","C"],[.5,.75,"--lime","B"],[.75,1,"--success","A"]];
  var s='<svg viewBox="0 0 300 160" role="img" aria-label="Страховой балл '+score+' из 500, класс B">';

document.addEventListener("input",function(e){
  var id=e.target.id,v=e.target.value;
  if(id==="q"){S.query=v;$("caseList").innerHTML=caseListHTML();}
  else if(id==="qSum"){S.quick.sum=v;$("qOut").innerHTML=quickOut();}
  else if(id==="qReq"){S.quick.req=v;$("qOut").innerHTML=quickOut();}
  else if(id==="oN"){S.osgor.n=v;$("oOut").innerHTML=osgorOut();}
  else if(id==="oW"){S.osgor.wage=v;$("oOut").innerHTML=osgorOut();}
  else if(id==="milIn"){S.chk.mil=v;}
});
document.addEventListener("change",function(e){if(e.target.id==="qProd"){S.quick.prod=e.target.value;$("qOut").innerHTML=quickOut();}});
document.addEventListener("submit",function(e){
  e.preventDefault();
  if(e.target.id==="sendForm"){var i=$("chatIn"),t=i.value.trim();if(!t){i.focus();return;}
    var key=null;Object.keys(ANSWERS).forEach(function(k){if(ANSWERS[k].q===t)key=k;});askQ(t,key);var n=$("chatIn");if(n)n.focus();}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){if(S.sheet){S.sheet=null;render();}else if(S.act.sec!=null){S.act.sec=null;render();}}
  if(e.key==="Enter"&&e.target.id==="ed"){e.preventDefault();A.saveFact(S.chk.edit);}
  if(e.key==="Enter"&&e.target.id==="valIn"){e.preventDefault();A.saveVal();}
  if(e.key==="Enter"&&e.target.id==="milIn"){e.preventDefault();A.milSave();}
});

/* ===== витрина экранов ===== */
var STORIES=[
 ["Дела",[["cases","Список дел"],["cases-loading","Загрузка"],["cases-empty","Ничего не найдено"]]],
 ["Новый",[["new","Выбор типа"],["shoot","Осмотр · 1 Съёмка"],["check","Осмотр · 2 Проверка"],["check-fix","Проверка · Поправить"],["check-done","Проверка · всё собрано"],["sheet-factors","Шторка · Факторы"],["act-loading","Осмотр · 3 Акт, загрузка"],["act","Осмотр · 3 Акт"]]],
 ["Акт",[["act-scen","Вкладка Сценарии"],["act-market","Вкладка Рынок"],["act-object","Вкладка Объект"],["act-score","Из чего сложился балл"],["act-s1","1 Объект"],["act-s2","2 Осмотр"],["act-s3","3 Стоимость"],["act-s4","4 Риск-факторы и франшиза"],["act-s5","5 Заключение"],["act-pml","Сценарии: подробнее"],["act-uz","Акт на узбекском"]]],
 ["Другие типы",[["quick","Быстрый расчёт"],["osgor","ОСГОР"]]],
 ["Специалист",[["spec","Чат с ответом"],["spec-empty","Пустая история"]]],
 ["Профиль",[["profile","Профиль и тема"],["logout","Выход"]]]
];
var curStory="cases";
function markStory(){var b=document.querySelectorAll("#stories button");for(var i=0;i<b.length;i++)b[i].classList.toggle("on",b[i].getAttribute("data-v")===curStory);}
function storiesHTML(){return STORIES.map(function(g){return '<h4>'+g[0]+'</h4><div class="st-list">'+g[1].map(function(s){return '<button data-a="story" data-v="'+s[0]+'">'+s[1]+'</button>';}).join("")+'</div>';}).join("");}
function toActDone(){startInspect();S.chk.stage=3;S.chk.a1="Всё верно";S.chk.a2="Принять 3 100 000 000 сум";S.chk.a3="Пропустить, уточню позже";upsertNew("done");S.step=3;S.flow="inspect";}
function story(id){
  var th=S?themeNow():null;
  clearTimeout(actT);clearTimeout(askT);
  S=fresh();curStory=id;lastKey="";
  switch(id){
    case "cases-loading":S.pinSk=true;break;
    case "cases-empty":S.query="бульдозер";break;
    case "new":S.tab="new";break;
    case "shoot":S.tab="new";startInspect();break;
    case "check":S.tab="new";startInspect();S.step=2;break;
    case "check-fix":S.tab="new";startInspect();S.step=2;S.chk.fix=true;S.chk.edit="mass";break;
    case "check-done":S.tab="new";startInspect();S.step=2;S.chk.stage=3;S.chk.a1="Всё верно";S.chk.a2="Принять 3 100 000 000 сум";S.chk.a3="2 000–5 000 моточасов";break;
    case "sheet-factors":S.tab="new";startInspect();S.step=2;S.chk.stage=3;S.chk.a1="Всё верно";S.chk.a2="Принять 3 100 000 000 сум";S.chk.a3="4 200 моточасов";S.sheet="factors";break;
    case "act-loading":S.tab="new";toActDone();S.act.pin=true;break;
    case "act":S.tab="new";toActDone();break;
    case "act-scen":S.tab="new";toActDone();S.act.tab="scen";break;
    case "act-market":S.tab="new";toActDone();S.act.tab="market";break;
    case "act-object":S.tab="new";toActDone();S.act.tab="object";break;
    case "act-score":S.tab="new";toActDone();S.act.sec="score";break;
    case "act-s1":S.tab="new";toActDone();S.act.sec=1;break;
    case "act-s2":S.tab="new";toActDone();S.act.sec=2;break;
    case "act-s3":S.tab="new";toActDone();S.act.sec=3;break;
    case "act-s4":S.tab="new";toActDone();S.act.sec=4;S.act.meas.park={d:1,c:1};S.act.meas.gps={d:1,c:0};break;
    case "act-s5":S.tab="new";toActDone();S.act.sec=5;break;
    case "act-pml":S.tab="new";toActDone();S.act.sec="scen";break;
    case "act-uz":S.tab="new";toActDone();S.act.lang="uz";break;
    case "quick":S.tab="new";S.flow="quick";break;
    case "osgor":S.tab="new";S.flow="osgor";break;
    case "spec":S.tab="spec";S.chat=[{day:"Вчера"},{me:"Какой лимит на один риск?"},{bot:"limit"},{day:"Сегодня"},{me:ANSWERS.rate.q},{bot:"rate"}];break;
    case "spec-empty":S.tab="spec";S.chat=[];S.ctx=false;break;
    case "profile":S.tab="profile";break;
    case "logout":S.tab="profile";S.sheet="logout";break;
  }
  render();
}

/* ===== запуск ===== */
$("stories").innerHTML=storiesHTML();
(function init(){
  var t=null;try{t=localStorage.getItem("proto-theme");}catch(e){}
  var h=(location.hash||"").slice(1);
  if(/-dark$/.test(h)){t="dark";h=h.replace(/-dark$/,"");}
  else if(/-light$/.test(h)){t="light";h=h.replace(/-light$/,"");}
  if(t&&t!=="auto")setTheme(t);
  var ids=[];STORIES.forEach(function(g){g[1].forEach(function(s){ids.push(s[0]);});});
  if(h&&ids.indexOf(h)>=0){story(h);return;}
  S.loading=true;render();
  setTimeout(function(){S.loading=false;if($("caseList"))$("caseList").innerHTML=caseListHTML();},reduce()?0:700);
})();
})();
</script>
